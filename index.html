function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pg1=p=>(p||'n').split(',')[0].trim();
function genQuiz(id){const its=ITEMS[id]||[];const box=document.getElementById(id+'-rq');if(!its.length)return;
 const qs=[];const used=new Set();
 const same=(it,k)=>shuf(its.filter(x=>x!==it&&pg1(x.p)===pg1(it.p)&&x.m!==it.m&&x.w.toLowerCase()!==it.w.toLowerCase())).slice(0,k);
 const anyD=(it,k)=>shuf(its.filter(x=>x!==it&&x.m!==it.m)).slice(0,k);
 const dist=(it,k)=>{let d=same(it,k);if(d.length<k)d=d.concat(anyD(it,k).filter(x=>!d.includes(x))).slice(0,k);return d};
 const withEx=shuf(its.filter(it=>it.ex&&new RegExp('\\b'+it.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i').test(it.ex)));
 withEx.slice(0,4).forEach(it=>{used.add(it);const ds=dist(it,3);const opts=shuf([it,...ds]);
  qs.push({type:'Hoàn thành câu (kiểu Part 5)',q:esc(it.ex).replace(new RegExp('\\b'+it.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i'),'<b class="blank">______</b>'),o:opts.map(x=>esc(x.w)),a:opts.indexOf(it),e:`<b>${esc(it.w)}</b> (${esc(it.p||'')}) – ${esc(it.m)}${it.exvi?'<br><i>'+esc(it.exvi)+'</i>':''}`})});
 const rest=shuf(its.filter(x=>!used.has(x)));
 rest.slice(0,3).forEach(it=>{used.add(it);const ds=dist(it,3);const opts=shuf([it,...ds]);
  qs.push({type:'Chọn nghĩa đúng',q:`<b>${esc(it.w)}</b> <span class="p ${pcls(it.p||'')}">${esc(it.p||'')}</span>${it.i?` <span class="i">/${esc(it.i)}/</span>`:''} nghĩa là gì?`,o:opts.map(x=>esc(x.m)),a:opts.indexOf(it),e:`<b>${esc(it.w)}</b> = ${esc(it.m)}`})});
 rest.slice(3,6).forEach(it=>{const ds=dist(it,3);const opts=shuf([it,...ds]);
  qs.push({type:'Chọn từ theo nghĩa',q:`Từ nào có nghĩa “<b>${esc(it.m)}</b>”?`,o:opts.map(x=>esc(x.w)),a:opts.indexOf(it),e:`<b>${esc(it.w)}</b> (${esc(it.p||'')})${it.i?' /'+esc(it.i)+'/':''} – ${esc(it.m)}`})});
 const Q=shuf(qs);box._st={ok:0,done:0,n:Q.length};
 box.querySelector('.rqs').textContent=`Đúng 0/0 · ${Q.length} câu`;
 box.querySelector('.rqb').innerHTML=Q.map((x,i)=>`<div class="rqq" data-a="${x.a}"><div class="rqt">${i+1}. <span>${x.type}</span></div><div class="rqx">${x.q}</div>${x.o.map((o,k)=>`<button class="rqo" data-o="${k}">(${'ABCD'[k]}) ${o}</button>`).join('')}<div class="rqe">✔ ${x.e}</div></div>`).join('');
 box.querySelector('.rqgo').textContent='🎲 Tạo bài khác';box.scrollIntoView({block:'start',behavior:'smooth'})}
function setBarH(){const b=document.querySelector('.bar');document.documentElement.style.setProperty('--barh',(b?b.offsetHeight:0)+'px')}
setBarH();addEventListener('resize',setBarH);
let navT;addEventListener('scroll',()=>{clearTimeout(navT);navT=setTimeout(()=>{const off=(document.querySelector('.bar').offsetHeight||0)+70;
 document.querySelectorAll('.sec[open] .tnav').forEach(nv=>{const sec=nv.closest('.sec');const r=sec.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;
  let cur=sec.id,best=-1e9;nv.querySelectorAll('[data-jump]').forEach(b=>{const el=document.getElementById(b.dataset.jump);if(!el||el===sec)return;const tp=el.getBoundingClientRect().top;if(tp<off&&tp>best){best=tp;cur=b.dataset.jump}});const nvTop=nv.getBoundingClientRect().top;['sit','rq'].forEach(k=>{if(cur===sec.dataset.id+'-'+k){const el=document.getElementById(cur);if(el.getBoundingClientRect().bottom<nvTop+10)cur=sec.id}});
  if(sec.getBoundingClientRect().top>-10)cur=sec.id;
  nv.querySelectorAll('[data-jump]').forEach(b=>{const on=b.dataset.jump===cur;if(on&&!b.classList.contains('on'))nv.scrollTo({left:b.offsetLeft-20,behavior:'smooth'});b.classList.toggle('on',on)})})},60)},{passive:true});


// ===== Highlight =====
const exEl=document.getElementById('exam'),hlbar=document.getElementById('hlbar');
let hlMark=null,hlRange=null;
function selInHL(){const s=getSelection();if(!s.rangeCount||s.isCollapsed)return null;const r=s.getRangeAt(0);const c=r.commonAncestorContainer;const base=c.nodeType===1?c:c.parentElement;const el=base.closest('[data-hk]');if(!el||!exEl.contains(el))return null;if(!r.toString().trim())return null;return r}
function wrapRange(r,cls){const root=r.commonAncestorContainer.nodeType===1?r.commonAncestorContainer:r.commonAncestorContainer.parentNode;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const L=[];let n;
 while(n=w.nextNode()){if(!r.intersectsNode(n))continue;if(n.parentElement.closest('button'))continue;let s=0,e=n.nodeValue.length;if(n===r.startContainer)s=r.startOffset;if(n===r.endContainer)e=r.endOffset;if(e>s&&n.nodeValue.slice(s,e).trim())L.push([n,s,e])}
 L.forEach(([t,s,e])=>{const mid=t.splitText(s);mid.splitText(e-s);const m=document.createElement('mark');m.className='hl '+cls;mid.parentNode.insertBefore(m,mid);m.appendChild(mid)})}
function saveHL(){XS.hl={};exEl.querySelectorAll('[data-hk]').forEach(el=>{if(el.querySelector('mark.hl'))XS.hl[el.dataset.hk]=el.innerHTML});xsave()}
function unwrap(m){const p=m.parentNode;while(m.firstChild)p.insertBefore(m.firstChild,m);p.removeChild(m);p.normalize()}
function showBar(x,y,html){hlbar.innerHTML=html;hlbar.hidden=false;const w=hlbar.offsetWidth;hlbar.style.left=Math.max(6,Math.min(innerWidth-w-6,x-w/2))+'px';hlbar.style.top=Math.max(6,y-52)+'px'}
function hideBar(){hlbar.hidden=true;hlMark=null}
let selT;document.addEventListener('selectionchange',()=>{if(exEl.hidden)return;clearTimeout(selT);selT=setTimeout(()=>{const r=selInHL();if(!r){if(!hlMark)hideBar();return}hlRange=r.cloneRange();hlMark=null;const b=r.getBoundingClientRect();
 showBar(b.left+b.width/2,b.top,`<button data-hl="y" class="c y"></button><button data-hl="g" class="c g"></button><button data-hl="p" class="c p"></button><button data-hlk="1">💡 Tra nghĩa</button><button data-hlx="1">✕</button>`)},250)});
hlbar.addEventListener('mousedown',e=>e.preventDefault());
hlbar.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.hl&&hlRange){wrapRange(hlRange,b.dataset.hl);getSelection().removeAllRanges();saveHL();hideBar();return}
 if(b.dataset.hlk){const txt=hlMark?hlMark.textContent:(hlRange?hlRange.toString():'');const el=(hlMark||(hlRange&&hlRange.startContainer.parentElement));getSelection().removeAllRanges();hideBar();lookupWord(txt.trim(),el);return}
 if(b.dataset.hlu&&hlMark){unwrap(hlMark);saveHL();hideBar();return}
 if(b.dataset.hla){exEl.querySelectorAll('mark.hl').forEach(unwrap);XS.hl={};xsave();hideBar();return}
 if(b.dataset.hlx){getSelection().removeAllRanges();hideBar()}});
exEl.addEventListener('click',e=>{const m=e.target.closest('mark.hl');if(m&&getSelection().isCollapsed){hlMark=m;const b=m.getBoundingClientRect();showBar(b.left+b.width/2,b.top,`<button data-hlu="1">🧽 Bỏ tô</button><button data-hlk="1">💡 Tra nghĩa</button><button data-hla="1">Xóa hết tô</button><button data-hlx="1">✕</button>`);e.stopPropagation()}},true);
document.getElementById('exq').addEventListener('scroll',hideBar,{passive:true});document.getElementById('exs').addEventListener('scroll',hideBar,{passive:true});
// ===== AI helper =====
let SAMPLE=null;const aip=document.getElementById('aip'),aipb=document.getElementById('aipb');let AI={n:null,msgs:[],ctl:null};
try{if(window.claude&&claude.use)claude.use('sample').then(s=>{SAMPLE=s}).catch(()=>{})}catch(e){}
const WIDX={};DATA.filter(g=>g.group).forEach(g=>g.sections.forEach(s=>(s.subs||[]).forEach(sb=>sb.items.forEach(it=>{const k=it.w.toLowerCase();if(!WIDX[k])WIDX[k]=it}))));
function findLocal(w){const W=w.toLowerCase().replace(/[^a-z\- ']/g,'').trim();for(const c of [W,W.replace(/ies$/,'y'),W.replace(/ied$/,'y'),W.replace(/es$/,''),W.replace(/s$/,''),W.replace(/ed$/,''),W.replace(/d$/,''),W.replace(/ing$/,''),W.replace(/ing$/,'e'),W.replace(/ly$/,'')]){if(WIDX[c])return WIDX[c]}return null}
const mdA=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#+\s*(.*)$/gm,'<b>$1</b>').replace(/^[-•]\s+(.*)$/gm,'<div class="li">• $1</div>').replace(/\n/g,'<br>');
function qInfo(n){for(const b of EX[XID].blocks){const x=b.qs.find(q=>q.n==n);if(x)return {b,x}}return null}
function ctxText(n){const {b,x}=qInfo(n);let s='';if(b.text)s+=`ĐOẠN VĂN (${b.kind}):\n${b.text.replace(/--\((\d{3})\)--/g,'($1) ______')}\n\n`;s+=`CÂU ${x.n}${b.kind==='P5'?' (Part 5)':''}: ${x.q||'(điền vào chỗ trống ('+x.n+') trong đoạn văn)'}\n`+x.o.map((o,i)=>`(${'ABCD'[i]}) ${o}`).join('\n');
 if(XS.score!=null){s+=`\n\nĐÁP ÁN ĐÚNG: ${x.a}. Gợi ý giải thích có sẵn: ${x.e}`;const my=XS.ans[n];s+=`\nHọc viên đã chọn: ${my==null?'bỏ trống':'ABCD'[my]}`}return s}
const SYS='Bạn là giáo viên luyện thi TOEIC nghiêm khắc nhưng tận tình. Trả lời bằng tiếng Việt, ngắn gọn, rõ ràng, dùng gạch đầu dòng. Khi nêu từ vựng, ghi kèm từ loại và nghĩa.';
function openAI(n){AI={n,msgs:[],ctl:null};document.getElementById('aipq').textContent=n?`Câu ${n}`:'Tra từ';aipb.innerHTML='';aip.hidden=false;
 aip.querySelectorAll('[data-ai]').forEach(b=>{b.style.display=n?'':'none'});const ex=aip.querySelector('[data-ai="explain"]');if(ex){ex.disabled=XS.score==null;ex.title=XS.score==null?'Nộp bài để mở':''}
 if(n)addMsg('sys',XS.score==null?'Chưa nộp bài: AI chỉ gợi ý cách làm, không nói đáp án. Nộp bài xong sẽ mở "Giải thích đáp án".':'Đã nộp bài: có thể xem giải thích đầy đủ.');
 if(!SAMPLE)addMsg('sys','AI chưa kết nối được trong trình xem này (cần mở sổ tay trên claude.ai). Vẫn tra được nghĩa từ có trong sổ.')}
function addMsg(who,html){const d=document.createElement('div');d.className='am '+who;d.innerHTML=html;aipb.appendChild(d);aipb.scrollTop=aipb.scrollHeight;return d}
async function ask(userText,show){if(show)addMsg('me',esc(show));const out=addMsg('ai','<i>Đang suy nghĩ…</i>');
 if(!SAMPLE){out.innerHTML='AI chưa sẵn sàng ở đây. Hãy mở sổ tay trên claude.ai rồi thử lại.';return}
 AI.msgs.push({role:'user',content:userText});try{AI.ctl&&AI.ctl.abort()}catch(e){};AI.ctl=new AbortController();
 try{const r=await SAMPLE(AI.msgs,{signal:AI.ctl.signal,modelTier:'quick',onText:({text})=>{out.innerHTML=mdA(text);aipb.scrollTop=aipb.scrollHeight}});out.innerHTML=mdA(r.text);AI.msgs.push({role:'assistant',content:r.text})}
 catch(e){if(e&&e.name==='AbortError')return;AI.msgs.pop();out.innerHTML=e&&e.code==='not_granted'?'Bạn chưa cho phép trang dùng AI. Bấm lại và chọn Cho phép.':(e&&e.code==='rate_limited'?'Đang quá tải, thử lại sau ít phút.':'Không gọi được AI: '+esc((e&&e.message)||''))}}
function aiAction(kind){const n=AI.n;if(!n)return;const c=ctxText(n);let p,label;
 if(kind==='hint'){label='Gợi ý cách làm';p=XS.score==null?`${SYS}\n\n${c}\n\nHọc viên CHƯA nộp bài. Hãy gợi ý cách làm câu này: dạng câu hỏi, cần chú ý ngữ pháp/từ khóa gì, thông tin nằm ở đâu. TUYỆT ĐỐI KHÔNG nói đáp án đúng và không loại trừ đến mức lộ đáp án.`:`${SYS}\n\n${c}\n\nHãy chỉ ra mẹo nhận biết nhanh dạng câu này cho lần sau.`}
 if(kind==='explain'){if(XS.score==null)return;label='Giải thích đáp án';p=`${SYS}\n\n${c}\n\nGiải thích chi tiết vì sao đáp án đúng, vì sao từng đáp án còn lại sai, chỉ rõ câu/cụm trong đoạn văn làm căn cứ (nếu có). Nếu học viên chọn sai, nói rõ bẫy đã mắc.`}
 if(kind==='trans'){label='Dịch câu hỏi';p=`${SYS}\n\n${c}\n\nDịch câu hỏi và từng phương án sang tiếng Việt.${XS.score==null?' Không nói đáp án đúng.':''}`}
 if(kind==='vocab'){label='Từ vựng khó';p=`${SYS}\n\n${c}\n\nLiệt kê 5–8 từ/cụm từ khó trong câu hỏi, các phương án${qInfo(n).b.text?' và đoạn văn':''}: từ – từ loại – phiên âm IPA – nghĩa tiếng Việt.${XS.score==null?' Không nói đáp án đúng.':''}`}
 ask(p,label)}
function lookupWord(w,el){if(!w)return;if(aip.hidden||!AI.n)openAI(AI.n||null);const loc=findLocal(w);
 if(loc)addMsg('dict',`📖 <b>${esc(loc.w)}</b> ${loc.p?`<span class="p ${pcls(loc.p)}">${esc(loc.p)}</span>`:''} ${loc.i?`<span class="i">/${esc(loc.i)}/</span>`:''}<br>${esc(loc.m)}${loc.syn?`<br><small>= ${esc(loc.syn)}</small>`:''}${loc.ex?`<br><i>${esc(loc.ex)}</i>`:''}`);
 else addMsg('dict',`📖 "<b>${esc(w)}</b>" chưa có trong sổ tay.`);
 const sent=el?((el.closest('p,.eq,.msg,.li,td')||el).textContent||'').slice(0,400):'';
 ask(`${SYS}\n\nTra nghĩa "${w}"${sent?` trong ngữ cảnh câu: "${sent}"`:''}. Trả lời: từ loại, phiên âm IPA, nghĩa trong ngữ cảnh này, 1–2 nghĩa phổ biến khác (nếu có), 1 câu ví dụ kiểu TOEIC kèm dịch, và collocation hay gặp.`,`Tra nghĩa: ${w}`)}
exEl.addEventListener('click',e=>{const b=e.target.closest('[data-bulb]');if(b){e.stopPropagation();openAI(b.dataset.bulb);return}const a=e.target.closest('[data-ai]');if(a&&!a.disabled){aiAction(a.dataset.ai)}},true);
document.getElementById('aipx').onclick=()=>{try{AI.ctl&&AI.ctl.abort()}catch(e){}aip.hidden=true};
document.getElementById('aipf').onsubmit=e=>{e.preventDefault();const i=document.getElementById('aipi');const v=i.value.trim();if(!v)return;i.value='';
 if(!AI.n||/^[A-Za-z][A-Za-z\-' ]{0,30}$/.test(v)&&v.split(' ').length<=3&&!AI.msgs.length){lookupWord(v,null);return}
 const base=AI.n&&!AI.msgs.length?`${SYS}\n\n${ctxText(AI.n)}\n\n${XS.score==null?'(Học viên chưa nộp bài – không được nói đáp án.)\n':''}Câu hỏi của học viên: ${v}`:v;ask(base,v)};

const VO={};
function pickVoices(){try{const all=speechSynthesis.getVoices();const vs=all.filter(v=>/^en/i.test(v.lang));const us=vs.filter(v=>/US/i.test(v.lang));const pool=us.length?us.concat(vs.filter(v=>!us.includes(v))):vs;
 const fem=/female|samantha|zira|susan|karen|victoria|allison|ava|serena|moira|tessa|fiona|aria|jenny|google us english|nicky|joelle/i,mal=/(^|\W)male|david|daniel|alex|fred|mark|guy|george|rishi|aaron|tom|evan|nathan/i;
 VO.W=pool.find(v=>fem.test(v.name))||pool[0];VO.M=pool.find(v=>mal.test(v.name)&&!/female/i.test(v.name))||pool.find(v=>v!==VO.W)||pool[0];VO.N=pool.find(v=>v!==VO.W&&v!==VO.M)||VO.M||VO.W;
 document.querySelectorAll('.vnote').forEach(n=>n.textContent=pool.length?'':'Thiết bị chưa có giọng đọc tiếng Anh – hãy cài giọng English trong cài đặt.')}catch(e){}}
let curPlay=null;
function stopAll(){try{speechSynthesis.cancel()}catch(e){};document.querySelectorAll('.play.on').forEach(b=>{b.classList.remove('on');b.textContent=b.dataset.lbl})}
if('speechSynthesis' in window){pickVoices();speechSynthesis.onvoiceschanged=pickVoices}else document.querySelectorAll('.vnote').forEach(n=>n.textContent='Trình duyệt này không hỗ trợ đọc tiếng – hãy dùng Chrome/Safari.');
document.addEventListener('click',e=>{const b=e.target.closest('.play');if(!b)return;e.stopPropagation();
 if(b.classList.contains('on')){stopAll();return}stopAll();if(!('speechSynthesis' in window))return;
 const rate=+(b.closest('.sec').querySelector('.rate')||{value:1}).value;const lines=SCR[b.dataset.play];
 b.dataset.lbl=b.dataset.lbl||b.textContent;b.classList.add('on');b.textContent='■ Dừng';
 lines.forEach(([sp,txt],i)=>{const u=new SpeechSynthesisUtterance(txt);u.lang='en-US';if(VO[sp])u.voice=VO[sp];u.rate=rate;u.pitch=sp==='M'?0.8:sp==='W'?1.15:1;
  if(i===lines.length-1)u.onend=()=>{b.classList.remove('on');b.textContent=b.dataset.lbl};speechSynthesis.speak(u)})},true);
try{const s=localStorage.getItem('toeic-sel');if(s&&[...sel.options].some(o=>o.value===s)){sel.value=s;apply()}}catch(e){}
