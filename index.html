nd", "because", "ahead of", "aside from"], "a": "C", "e": "ahead of + danh từ = trước (hạn). beforehand là trạng từ, không đi với danh từ; because cần mệnh đề."}, {"n": "102", "q": "Throughout the Elmgrove Park summer festival, visitors are invited to stroll _____ the tree-lined promenade at their own pace.", "o": ["above", "across", "between", "along"], "a": "D", "e": "stroll along the promenade = đi dạo dọc theo lối đi (along dùng cho đường, bờ, lối dài)."}, {"n": "103", "q": "_____ on the results of the employee satisfaction survey, Ms. Delphine Carraway assured staff that improvements would be introduced shortly.", "o": ["commented", "commenting", "comment", "comments"], "a": "B", "e": "Rút gọn mệnh đề chủ động cùng chủ ngữ: Commenting on…, Ms. Carraway assured… (= When she commented)."}, {"n": "104", "q": "Guests who wish to avoid the front desk can submit their checkout requests _____ through the Bellcourt Hotel's mobile application.", "o": ["directing", "direction", "directs", "directly"], "a": "D", "e": "Bổ nghĩa cho động từ submit → trạng từ directly (trực tiếp qua app)."}, {"n": "105", "q": "Ms. Coretta Vance accepted the innovation award _____ the product team and read a brief message from its members.", "o": ["on behalf of", "instead of", "except", "aside from"], "a": "A", "e": "accept an award on behalf of the team = nhận giải thay mặt cho cả nhóm."}, {"n": "106", "q": "The renovation dragged on for months, but the community library _____ reopened its doors to visitors last week.", "o": ["finally", "promptly", "narrowly", "thoroughly"], "a": "A", "e": "Kéo dài nhiều tháng nhưng cuối cùng cũng mở cửa → finally."}, {"n": "107", "q": "The completed enrollment form must be returned _____ the Larkhill Driving School office before the first lesson begins.", "o": ["at", "to", "in", "on"], "a": "B", "e": "return something to a place = gửi trả về văn phòng."}, {"n": "108", "q": "Ms. Corwin _____ all supplier orders placed at the downtown branch during the store manager's absence next week.", "o": ["to review", "reviewed", "will review", "is reviewed"], "a": "C", "e": "\"next week\" → tương lai: will review."}, {"n": "109", "q": "Throughout her eight years _____ a store manager, Ms. Castellano developed a strong reputation for fairness.", "o": ["as", "in", "at", "on"], "a": "A", "e": "as a store manager = với tư cách là quản lý cửa hàng."}, {"n": "110", "q": "Visitors to Thornbury Ceramics Studio may exchange their passes _____ a guided tour at the main desk before noon.", "o": ["for", "from", "toward", "on"], "a": "A", "e": "exchange A for B = đổi A lấy B."}, {"n": "111", "q": "Patients who provide a mobile number will receive automatic _____ the day before each scheduled visit.", "o": ["reminders", "schedules", "responses", "referrals"], "a": "A", "e": "receive automatic reminders the day before = nhận lời nhắc tự động."}, {"n": "112", "q": "Following the software update, the developers noted several _____ reviews from users worldwide.", "o": ["loyal", "positive", "spacious", "durable"], "a": "B", "e": "positive reviews = đánh giá tích cực. loyal/spacious/durable không đi với reviews."}, {"n": "113", "q": "Because seating is limited, participants must confirm their _____ at Copperpot Cooking Studio no later than three days before each class.", "o": ["presence", "appearance", "arrival", "attendance"], "a": "D", "e": "confirm their attendance = xác nhận tham dự."}, {"n": "114", "q": "The Ashbourne Events Center offers a _____ layout because guests need room to move freely between the display tables.", "o": ["crowded", "spacious", "narrow", "cramped"], "a": "B", "e": "Khách cần không gian di chuyển → bố trí rộng rãi (spacious)."}, {"n": "115", "q": "Your temporary parking permit _____ at midnight tonight, so please renew it at the front office before you leave.", "o": ["expiration", "to expire", "expires", "expiring"], "a": "C", "e": "Câu thiếu động từ chính, chủ ngữ số ít, lịch cố định → expires."}, {"n": "116", "q": "The revised vendor agreement outlines new terms _____ every supplier.", "o": ["and", "for", "both", "so"], "a": "B", "e": "terms for every supplier = điều khoản dành cho mọi nhà cung cấp."}, {"n": "117", "q": "The cordless vacuum's automatic dust sensor is widely considered its most _____ feature.", "o": ["innovation", "innovate", "innovated", "innovative"], "a": "D", "e": "the most + tính từ + danh từ → innovative feature."}, {"n": "118", "q": "The renovation permit that Halbrook Builders submitted last month is still _____ review, so construction cannot begin yet.", "o": ["under", "over", "within", "before"], "a": "A", "e": "under review = đang được xem xét."}, {"n": "119", "q": "Before any repairs begin, our technicians will provide each customer with a detailed _____ of the expected parts and labor costs.", "o": ["appraisal", "assessment", "estimate", "inventory"], "a": "C", "e": "a detailed estimate of costs = bản ước tính chi phí chi tiết (trước khi sửa)."}, {"n": "120", "q": "The new scheduling tool enables supervisors at Brantford Logistics to distribute weekly shifts _____ among all staff members.", "o": ["efficiency", "efficiencies", "efficient", "efficiently"], "a": "D", "e": "Bổ nghĩa cho động từ distribute → trạng từ efficiently."}, {"n": "121", "q": "The front-desk receptionist accepted the courier's parcel on _____ of a colleague who was out of the office all afternoon.", "o": ["favor", "regard", "behalf", "reason"], "a": "C", "e": "on behalf of = thay mặt cho đồng nghiệp vắng mặt."}, {"n": "122", "q": "Although the safety guidelines had been _____ explained, several volunteers still operated the tools incorrectly.", "o": ["clearly", "nearly", "barely", "soon"], "a": "A", "e": "had been clearly explained = đã được giải thích rõ ràng; câu sau \"vẫn làm sai\" tạo đối lập với although."}, {"n": "123", "q": "As soon as the order _____, the front desk will text the customer and set the cleaned garments aside for same-day pickup.", "o": ["arrived", "arrives", "is arriving", "will be arriving"], "a": "B", "e": "Mệnh đề thời gian (as soon as) không dùng will → hiện tại đơn arrives."}, {"n": "124", "q": "The senior _____ on duty monitors all three packaging machines from the central control booth.", "o": ["operating", "operator", "operation", "operable"], "a": "B", "e": "Sau tính từ senior cần danh từ chỉ người: operator (người vận hành) giám sát máy."}, {"n": "125", "q": "Ms. Adela Koval decorates each wedding cake at the bakery _____.", "o": ["she", "her", "hers", "herself"], "a": "D", "e": "by herself/ herself đứng cuối câu nhấn mạnh tự mình làm."}, {"n": "126", "q": "Kirchner Furnishings' revenue has climbed steadily despite sharp declines _____ the housing sector.", "o": ["through", "on", "at", "in"], "a": "D", "e": "declines in the housing sector = sự sụt giảm trong ngành nhà ở."}, {"n": "127", "q": "The lobby's refurbishment lasted six weeks, while the restaurant _____ reopened after only two.", "o": ["itself", "themselves", "it", "them"], "a": "A", "e": "the restaurant itself = chính nhà hàng (đại từ nhấn mạnh, số ít)."}, {"n": "128", "q": "Once the residents finish the required paperwork, the leasing office will mail the parking decals to _____ within five business days.", "o": ["they", "them", "their", "themselves"], "a": "B", "e": "Sau giới từ to cần tân ngữ → them (the residents)."}, {"n": "129", "q": "A complimentary shuttle will operate _____ the three-day craft fair at Marlowe Fairgrounds, departing from the main gate every half hour.", "o": ["between", "beyond", "among", "throughout"], "a": "D", "e": "throughout the three-day fair = suốt 3 ngày hội chợ."}, {"n": "130", "q": "The new guidelines for booking meeting rooms turned out to be _____ useful to first-time members.", "o": ["clears", "clear", "clearing", "clearly"], "a": "D", "e": "Bổ nghĩa cho tính từ useful → trạng từ clearly."}]}, {"kind": "P6", "text": "Part-Time Instructor Coordinator Wanted\n\nRosewood Driving School --(131)-- a dependable part-time coordinator to organize our lesson schedule and keep everyone informed. The role offers flexible daytime hours and suits anyone looking to fit work around other commitments.\n\nEach week the coordinator arranges instructor schedules, confirms lesson slots with learners, --(132)-- answers questions that arrive by telephone or email. The work is steady rather than demanding, and full guidance is given during the first two weeks.\n\nWe are looking for someone patient and clearly spoken. The right --(133)-- will stay calm when the schedule changes and will enjoy dealing with people. Previous office experience is welcome but is not required. --(134)--.", "qs": [{"n": "131", "q": "", "o": ["instructs", "employs", "requires", "provides"], "a": "C", "e": "requires a coordinator = cần tuyển một điều phối viên (thông báo tuyển dụng)."}, {"n": "132", "q": "", "o": ["or", "and", "but", "nor"], "a": "B", "e": "Liệt kê 3 nhiệm vụ A, B, and C → and."}, {"n": "133", "q": "", "o": ["coordinating", "coordinate", "coordination", "coordinator"], "a": "D", "e": "The right + danh từ chỉ người → coordinator (người phù hợp)."}, {"n": "134", "q": "", "o": ["The successful candidate started the coordinator role last week", "Our lesson bookings are all handled on the school website page", "Likewise, our fuel expenses have climbed sharply this year", "In addition, being comfortable using a computer is an advantage"], "a": "D", "e": "Sau câu \"kinh nghiệm văn phòng không bắt buộc\", câu bổ sung thêm yêu cầu khác: \"In addition, biết dùng máy tính là lợi thế\"."}]}, {"kind": "P6", "text": "From: mashwell@brackenfieldacademy.org\nTo: cwhitfield@blueharboraquarium.com\nDate: September 9\nSubject: Group visit request\n\nDear Ms. Whitfield,\n\nI am writing to arrange a guided group visit for one of our classes. I am the activities coordinator at Brackenfield Academy, which is currently in the middle of --(135)-- a program of educational outings for its senior students. The group would consist of thirty-eight students and four accompanying teachers, and we hope to come sometime in October. A --(136)-- of this size would require advance planning, so I wanted to contact you early. On your website, it appears you do --(137)-- offer guided tours designed for school groups. Could you tell me which dates that month still have availability? We would prefer a weekday morning, if one can be reserved. --(138)--.\n\nI look forward to your reply.\n\nSincerely,\n\nMiranda Ashwell\n\nBrackenfield Academy", "qs": [{"n": "135", "q": "", "o": ["develops", "develop", "developing", "developed"], "a": "C", "e": "in the middle of + V-ing → developing."}, {"n": "136", "q": "", "o": ["request", "party", "reply", "schedule"], "a": "B", "e": "A party of this size = một đoàn/nhóm khách cỡ này (party = nhóm người)."}, {"n": "137", "q": "", "o": ["nearly", "once", "actually", "merely"], "a": "C", "e": "do actually offer = thực sự có cung cấp (nhấn mạnh xác nhận thông tin trên website)."}, {"n": "138", "q": "", "o": ["That said, we could be flexible if only afternoons remain open", "If so, we would be glad to host your students at our school", "Our aquarium has welcomed school groups for many years now", "Sadly, we are unable to visit at any point this October"], "a": "A", "e": "Vừa nói muốn buổi sáng ngày thường → \"Dù vậy, nếu chỉ còn buổi chiều chúng tôi cũng linh hoạt được\"."}]}, {"kind": "P6", "text": "Local Bakery Takes Top Pastry Prize\n\nWider recognition --(139)-- to Elderford's Golden Whisk Bakery. Last Saturday, owner Marguerite Solberg accepted the first-place ribbon at the Northern Regional Pastry Championship, a two-day event held at the town's exhibition hall. --(140)--. Ms. Solberg, who opened the shop with her sister, said she was overwhelmed by the support of loyal customers and expects a surge of new visitors in the weeks ahead.\n\nThe panel sampled dozens of desserts and scored each one on taste and presentation. The judges observed that --(141)-- of the entries relied on seasonal fruit. The winning tart, however, used a rare imported honey instead. The bakery will feature its prizewinning tart in the front window, though the dessert will be sold only --(142)-- the winter months, until the supply of honey runs out.", "qs": [{"n": "139", "q": "", "o": ["is heading", "heads", "headed", "was heading"], "a": "A", "e": "Sự công nhận rộng rãi hơn đang đến với tiệm bánh (đang diễn ra) → is heading."}, {"n": "140", "q": "", "o": ["The imported honey gives the tart its distinctive flavor", "Nevertheless, several bakeries declined to enter this year", "More than forty bakeries from six counties competed for the honor", "The exhibition hall also hosts an annual antique fair each spring"], "a": "C", "e": "Sau khi nhận giải nhất cuộc thi → câu nói về quy mô cuộc thi: hơn 40 tiệm bánh tranh tài."}, {"n": "141", "q": "", "o": ["few", "each", "most", "much"], "a": "C", "e": "\"most of the entries relied on seasonal fruit. The winning tart, however, used honey\" → đa số (most)."}, {"n": "142", "q": "", "o": ["throughout", "when", "toward", "beyond"], "a": "A", "e": "sold only throughout the winter months = chỉ bán trong suốt mùa đông."}]}, {"kind": "P6", "text": "Meadowbrook Storage is pleased to announce a new set of climate-controlled units, now available to residents and small businesses --(143)-- require reliable protection for sensitive belongings. Each unit --(144)-- a steady temperature throughout the year, shielding furniture, documents, and electronics from heat and humidity. --(145)--. Units are offered in a range of sizes to suit personal and commercial needs, and access is available from six in the morning until ten at night, every day of the week. To reserve a unit today, please visit our office on Harlow Street or call our staff. When you arrive, remember to bring a valid form of --(146)--, such as a driver's license or passport, to complete your booking.", "qs": [{"n": "143", "q": "", "o": ["when", "there", "that", "therefore"], "a": "C", "e": "Đại từ quan hệ thay cho residents and small businesses, làm chủ ngữ cho require → that."}, {"n": "144", "q": "", "o": ["will have maintained", "is maintaining", "maintained", "maintains"], "a": "D", "e": "Mô tả đặc điểm cố định của sản phẩm → hiện tại đơn maintains."}, {"n": "145", "q": "", "o": ["Around-the-clock security also guards every stored item", "Late monthly payments will incur an extra service fee", "Our staff will pack and move your belongings for free", "These units cannot safely store any electronic devices"], "a": "A", "e": "Câu trước nói kho bảo vệ đồ khỏi nhiệt và ẩm → câu tiếp \"Ngoài ra còn có bảo vệ 24/7\" (also)."}, {"n": "146", "q": "", "o": ["payment", "identification", "address", "contact"], "a": "B", "e": "a valid form of identification, such as a driver's license or passport = giấy tờ tùy thân."}]}, {"kind": "P7", "text": "Machine Operating Instructions\nFollow the steps below to run a load.\n1. Sort and place the fabric inside an empty drum.\n2. Pour one measure of detergent into the tray.\n3. Turn the dial to select a wash cycle.\n4. Insert coins into the slot and press start.\nCaution: Remove your load promptly once the cycle finishes.", "qs": [{"n": "147", "q": "Where would the instructions most likely be posted?", "o": ["In a store selling cleaning supplies", "In a clothing shop", "In a residential laundry room", "At a beverage vending machine"], "a": "C", "e": "Máy giặt bỏ xu, có hướng dẫn giặt → phòng giặt (khu dân cư)."}, {"n": "148", "q": "What is the main purpose of the instructions?", "o": ["To describe a method of payment", "To explain how to operate the equipment", "To issue a safety warning", "To announce a maintenance schedule"], "a": "B", "e": "Các bước vận hành máy → hướng dẫn sử dụng thiết bị."}]}, {"kind": "P7", "text": "Dana Whitcomb (6:02 P.M.): Hi both. My carpool just got moved up, so I can't stay for the closing shift tonight. Could either of you cover the register from 7 until we lock up at 9?\n\nOwen Petrakis (6:06 P.M.): I can take it, though I'd have to leave by 8:15 to catch my class.\n\nRenata Cho (6:10 P.M.): I could stay past 8 if Owen needs to go early.\n\nDana Whitcomb (6:13 P.M.): Wait.\n\nDana Whitcomb (6:14 P.M.): The assistant manager just offered to close tonight, so the shift is already covered.\n\nOwen Petrakis (6:16 P.M.): Great, thanks for letting us know!", "qs": [{"n": "149", "q": "What is the main purpose of the text-message chain?", "o": ["To organize a carpool schedule", "To announce a change to the store's hours", "To arrange coverage for an unexpectedly open shift", "To confirm what time the store will be locked up"], "a": "C", "e": "Dana cần người trực thay ca tối bất ngờ trống → sắp xếp người thay ca."}, {"n": "150", "q": "At 6:13 P.M., what does Ms. Whitcomb most likely mean when she writes, \"Wait\"?", "o": ["She now has information that changes her request", "She wants Renata rather than Owen to take the shift", "She needs more time to decide who should stay", "She is concerned that no one is able to close"], "a": "A", "e": "\"Wait\" rồi báo trợ lý quản lý đã nhận ca → cô có thông tin mới làm thay đổi yêu cầu."}]}, {"kind": "P7", "text": "Meet BrewGo from Fernhollow Coffee Roasters\n\nOrdering your morning coffee just got easier. Fernhollow Coffee Roasters has launched BrewGo, our brand-new mobile app that lets you place and pay for your order right from your phone, before you ever set foot in the shop.\n\nNo more waiting in line. Tap your order, choose a pickup time, and your drink will be freshly made and waiting for you the moment you walk through the door. Spend your break enjoying your coffee, not standing in line.\n\nBrewGo also remembers what you love. The app saves every order you have placed before, so your usual latte or weekend treat is just one tap away. Reordering your favorite takes seconds, with no need to search the menu again.\n\nTo celebrate the launch, we are giving every new user 20 percent off their very first order placed through the app. Download BrewGo today, create your free account, and claim the discount at checkout.\n\nBrewGo works at all 18 Fernhollow Coffee Roasters cafes. Search for BrewGo in your app store and start ordering the smarter way.", "qs": [{"n": "151", "q": "What is the purpose of the advertisement?", "o": ["To announce a reduction in prices across all stores", "To publicize the opening of an additional cafe location", "To recruit customers to test a product and share opinions", "To encourage customers to begin using a new ordering service"], "a": "D", "e": "Quảng cáo ứng dụng đặt hàng mới BrewGo → khuyến khích dùng dịch vụ đặt hàng mới."}, {"n": "152", "q": "What is indicated about the app?", "o": ["It stores a customer's earlier orders for fast reordering", "It can be used at only a limited number of locations", "It is available only with a paid monthly membership", "It offers faster service than any other coffee app"], "a": "A", "e": "\"The app saves every order you have placed before\" → lưu đơn cũ để đặt lại nhanh."}]}, {"kind": "P7", "text": "Marisol Okonkwo (10:02 A.M.): The client is arriving at 12:30 today. Can someone collect our lunch order from the café before then?\n\nDominic Reyes (10:04 A.M.): I can do it. They said it will be ready at 11:45, and there is enough for all of us and the client.\n\nMarisol Okonkwo (10:05 A.M.): Perfect, thank you.\n\nPetra Lindqvist (10:07 A.M.): I am at the printer's until one this morning. Could you keep a sandwich for me?\n\nMarisol Okonkwo (10:08 A.M.): Of course, I'll set one aside for you.\n\nPetra Lindqvist (10:10 A.M.): Thanks! I'll grab it as soon as I return.", "qs": [{"n": "153", "q": "What is indicated about the lunch order?", "o": ["It requires payment in advance.", "It will be ready at 12:30 P.M.", "It is meant for the client only.", "It will be ready before noon."], "a": "D", "e": "Sẽ xong lúc 11:45 → trước buổi trưa."}, {"n": "154", "q": "At 10:08 A.M., what does Ms. Okonkwo most likely mean when she writes, \"I'll set one aside for you\"?", "o": ["She will order additional food for Petra.", "She will deliver a sandwich to Petra at the printer's.", "She will keep part of the order for Petra.", "She will ask Dominic to bring food to Petra."], "a": "C", "e": "set one aside = để dành một phần (trong đơn đã đặt) cho Petra."}]}, {"kind": "P7", "text": "Marren Bay Aquarium\n\nThank you for booking a place on our Behind-the-Scenes Open Day. We are delighted to welcome marine photographer Fenella Drummond, who will greet arrivals in person and share images from her most recent expedition.\n\nGates open at 9:30 A.M., and the day concludes at 2:00 P.M. The full program is shown below.\n\nSession Time\tWhat Happens\tWho Hosts / Who Joins\tWhere\n10:00 A.M.\tWelcome briefing\tAll visitors\tMain Foyer\n10:45 A.M.\tFeeding demonstration\tOscar Bellamy\tFiltration Gallery (normally staff only)\n12:00 P.M.\tRefreshment break\tAll visitors\tKelp Garden Cafe\n12:30 P.M.\tTouch pool session\tAll visitors\tRockpool Discovery Zone\nBefore you arrive, please wear flat, non-slip shoes, as the walkways beside the pools can be wet. During each session, stay with your group and move on to the next area only when your host invites you to do so. Our hosts are happy to help, so please ask them your questions aloud at any point.", "qs": [{"n": "155", "q": "Who most likely is Oscar Bellamy?", "o": ["A photographer visiting the aquarium", "A member of the animal-care staff", "An attendant at the refreshment cafe", "A visitor who has booked a place"], "a": "B", "e": "Ông chủ trì buổi cho ăn ở khu thường chỉ dành cho nhân viên → nhân viên chăm sóc động vật."}, {"n": "156", "q": "When will the touch pool session begin?", "o": ["At 9:30 A.M.", "At 10:00 A.M.", "At 12:30 P.M.", "At 2:00 P.M."], "a": "C", "e": "Touch pool session lúc 12:30 P.M."}, {"n": "157", "q": "What does the schedule suggest about the visitors?", "o": ["Their freedom to move about will be limited during sessions.", "One of the session areas will be closed to visitors.", "They will need to submit their questions in writing.", "They will be permitted to leave before the day ends."], "a": "A", "e": "\"stay with your group and move on only when your host invites you\" → bị hạn chế di chuyển."}]}, {"kind": "P7", "text": "From: Douglas Hartmann\nTo: Fiona Kessler\nSubject: Confirmation of your Ashwell Yearly Care Plan enrollment\nDate: 14 March\n\n\nDear Ms. Kessler,\n\nThank you for joining the Ashwell Yearly Care Plan. This message is to confirm that your enrollment is now active and that your vehicle is covered under the plan beginning today.\n\nYour plan brings you several benefits. You will receive first access to appointment times ahead of other customers, a complimentary safety inspection at each visit, reduced rates on replacement parts and labor, and guidance from our certified technicians whenever a concern arises. Please note that this coverage remains valid for twelve months from the date of enrollment and must be renewed once that period ends.\n\nTo arrange your first appointment, simply telephone the center or book online whenever it suits you, and our team will confirm a time that works for your schedule. Any repairs still covered by your manufacturer's warranty will continue to be handled separately.\n\nI have attached your personal plan summary for your records.\n\nKind regards,\n\nDouglas Hartmann\nService Adviser, Ashwell Auto Centre", "qs": [{"n": "158", "q": "Why did Mr. Hartmann send the e-mail to Ms. Kessler?", "o": ["To offer discounts on vehicle parts", "To arrange a customer's first appointment", "To confirm a customer's enrollment in a plan", "To request that a customer renew coverage"], "a": "C", "e": "\"This message is to confirm that your enrollment is now active\"."}, {"n": "159", "q": "What is NOT mentioned as a benefit included in the plan?", "o": ["Priority booking of appointments", "Complimentary vehicle inspections", "Reduced rates on parts and labor", "Automatic renewal of coverage"], "a": "D", "e": "Gói phải gia hạn sau 12 tháng (\"must be renewed\") → không tự động gia hạn."}, {"n": "160", "q": "What did Mr. Hartmann attach to the e-mail?", "o": ["A summary of the customer's plan", "An invoice for the plan", "A copy of a manufacturer's warranty", "A promotional brochure"], "a": "A", "e": "\"I have attached your personal plan summary\"."}]}, {"kind": "P7", "text": "Rowan Hill Homeware · 118 Aldergate Street · Millpond 4021\n\n3 June\n\nDear HomeGuard Protection Plan Member,\n\nThank you for being a valued member of our HomeGuard Protection Plan. Because your membership entitles you to complimentary care events throughout the year, we are delighted to invite you to a free hands-on maintenance workshop held at our store. The session is offered at no charge, and this invitation is being sent to our plan members only.\n\nDuring the workshop you will learn how to clean, adjust, and prolong the life of the kitchen appliances and cookware we carry, and you will also preview several new items arriving this season. The session will be led by Coledale Appliance Specialists, a repair and servicing firm whose technicians are certified to open and recalibrate the motors and heating elements that our own staff are not trained to handle. Their guidance will help you keep the products you already own running safely for years. Although Rowan Hill Homeware has served the Millpond area for 22 years, this is the first time we have brought in outside experts of this kind.\n\nSeating is limited, so early booking is encouraged. Two identical sessions will be held on Saturday, 14 June, at our Aldergate Street shop, one beginning at 10 a.m. and one at 2 p.m. To reserve a place in either session, please telephone our Events Desk at 03 5567 2200. Our website lists our full product range but is not used for workshop bookings.\n\nWe hope to see you there.\n\nWarm regards,\n\nRowan Hill Homeware", "qs": [{"n": "161", "q": "What is the purpose of the letter?", "o": ["To thank members for their years of loyalty", "To advertise newly arrived merchandise", "To introduce a new business partner to customers", "To invite members to a complimentary workshop"], "a": "D", "e": "Mời thành viên tới workshop bảo dưỡng miễn phí."}, {"n": "162", "q": "What is suggested about Coledale Appliance Specialists?", "o": ["Its own customers will soon receive this letter.", "It has operated in the area for 22 years.", "It provides technical services the store's own staff cannot.", "Its premises are inconvenient for Millpond residents."], "a": "C", "e": "Kỹ thuật viên của họ làm được việc mà nhân viên cửa hàng \"are not trained to handle\"."}, {"n": "163", "q": "According to the letter, what should recipients do to reserve a seat at the workshop?", "o": ["Send an e-mail to the store", "Telephone the number provided for the Events Desk", "Complete a booking on the store's website", "Go in person to Coledale's service center"], "a": "B", "e": "\"please telephone our Events Desk\"; website không dùng để đặt chỗ."}]}, {"kind": "P7", "text": "Made to Last: The Quiet Craft of Fairholme\n\nBy Adrian Colville\n\nFor more than thirty years, Fairholme has built a quiet reputation among people who care how a machine is made. Every model leaving its small workshop begins with a hand-brazed steel frame, a broad spread of gears for climbing and descending, and hand-laced wheels chosen for strength rather than weight.\n\nIts founders remain sure that a frame built slowly will outlast several cheaper ones. Each joint is filed and polished before painting, and every finished frame is tested to be certain it can handle years of daily use on rough ground.\n\nFairholme makes no effort to court racers or weekend competitors. Its owners are the people who ride the same route to work each morning, carry shopping home each evening, and expect a machine ready to go in any weather.\n\nOne detail that longtime owners praise is the fully enclosed chain cover. By sealing the chain away from rain and grit, it saves riders from marking their clothes when they set out in ordinary dress rather than cycling gear. A built-in dynamo, meanwhile, powers the lamps, sparing riders the worry of flat batteries after dark.\n\nWhatever the model, the goal stays the same: a machine that asks little and serves for many years.", "qs": [{"n": "164", "q": "For whom is the article most likely intended?", "o": ["People who design bicycles", "People who ride bicycles daily", "People who sell bicycles", "People who race bicycles"], "a": "B", "e": "Khách hàng là người đạp xe đi làm, đi chợ hằng ngày → người dùng xe đạp hằng ngày."}, {"n": "165", "q": "What type of product does Fairholme make?", "o": ["Bicycle lamps", "Athletic clothing", "Bicycles", "Motorcycles"], "a": "C", "e": "Khung, bánh xe, xích, líp → xe đạp."}, {"n": "166", "q": "According to the article, why do owners value the enclosed chain cover?", "o": ["It keeps riders' everyday clothes clean", "It makes the bicycle lighter to carry", "It removes worry about dead batteries", "It lights the road after dark"], "a": "A", "e": "Vỏ xích kín giúp không làm bẩn quần áo thường ngày."}, {"n": "167", "q": "The word \"handle\" in paragraph 2 is closest in meaning to", "o": ["grip", "withstand", "operate", "manage"], "a": "B", "e": "handle years of daily use = chịu được (withstand)."}]}, {"kind": "P7", "text": "Pemberton Business Network\n42 Calderwood Street\n12 September\n\nDear Ms. Ackroyd,\n\nOn behalf of the entire committee, I am pleased to inform you that Ackroyd Ceramics has been chosen as a finalist in this year's Pemberton Enterprise Awards. Being named a finalist is a significant honor, and the winners in each category will be announced during the ceremony itself.\n\nNow in its ninth year, our program continues to celebrate outstanding local businesses. Nominations were submitted by members of the community and then reviewed by an independent selection panel. Nominations for this year closed in August. The finalists represent five categories: retail, hospitality, craft manufacturing, community service, and innovation. A cash prize will be awarded to the winner named in each category. Last year's overall winner, Foxton Leatherworks, will help present this year's awards.\n\nThe ceremony will feature a short talk by Bernadette Lowry. Ms. Lowry began her career in Canada before opening her own firm in our region, and she now devotes much of her time to mentoring young business owners. She has also announced that she will step back from her role as director of that firm next year.\n\nThe ceremony will be held on 18 October at Redmayne Hall, beginning at 6:30 P.M. A reception with refreshments will follow. Parking is available in the lot beside the hall. As this is an invitation-only event with limited seating, please confirm your attendance by 4 October.\n\nSincerely,\nMalcolm Everhart\nAwards Director, Pemberton Business Network\nTelephone 555-0148 or e-mail awards@pembertonnetwork.org", "qs": [{"n": "168", "q": "What is the purpose of the letter?", "o": ["To announce a competition winner", "To request further nominations", "To advertise a public gala", "To notify a business of its selection"], "a": "D", "e": "Thông báo Ackroyd Ceramics được chọn vào vòng chung kết."}, {"n": "169", "q": "What is indicated about the Pemberton Enterprise Awards?", "o": ["Most finalists come from a single industry.", "The program is being held for the first time.", "Nominations were made by local residents.", "A prize is given to every finalist."], "a": "C", "e": "\"Nominations were submitted by members of the community\" → người dân địa phương đề cử."}, {"n": "170", "q": "What is mentioned about Ms. Lowry?", "o": ["She has recently retired.", "She began her career in another country.", "She runs the awards program.", "She previously won an award."], "a": "B", "e": "\"began her career in Canada\" → nước khác."}, {"n": "171", "q": "What is NOT suggested about the ceremony?", "o": ["Parking is available nearby.", "Live entertainment will be performed.", "A reception will follow the ceremony.", "Guests must confirm their attendance."], "a": "B", "e": "Không nhắc tới biểu diễn giải trí; có bãi xe, tiệc chiêu đãi, cần xác nhận tham dự."}]}, {"kind": "P7", "text": "Halcombe Electronics\nRetail and Membership Services\n14 February\nMr. Everett Sloane\nHalcombe Advantage Member\n\nDear Mr. Sloane,\n\nOn behalf of everyone at Halcombe Electronics, I am pleased to invite you to a private preview sale held exclusively for members of our Halcombe Advantage program. This is a one-time evening event, to be held on Saturday, 8 March, and it will take place before our new spring range of products reaches the general public.\n\nAs a member attending the evening, you will enjoy the following:\n\n- A discount of fifteen percent on all televisions, laptops, and home audio equipment shown that night.\n\n- A guided walk-through of the newest models, with our floor team present to demonstrate the products and answer your questions.\n\n- For Elite members only, a complimentary three-year protection plan applied to any qualifying purchase made during the event. This additional benefit is not available to members at the Standard level.\n\nTo attend, please reserve your place by telephoning our customer desk or visiting www.halcombeelectronics.com no later than Friday, 28 February. Because the store can seat only a limited number of guests on the evening, and the number of assistants we are able to schedule is fixed, places will be confirmed strictly in the order in which requests are received. Reserving early is the surest way to secure a spot.\n\nWe look forward to welcoming you.\n\nSincerely,\nNathaniel Briggs\nStore Manager, Halcombe Electronics", "qs": [{"n": "172", "q": "What is stated about the event?", "o": ["It is being organized by an outside company", "It allows members to see products before the general public", "It is held on a regular basis", "It features a number of well-known presenters"], "a": "B", "e": "Diễn ra \"before our new spring range… reaches the general public\"."}, {"n": "173", "q": "What is implied about Standard-level members?", "o": ["They were sent the letter by mistake", "They will all receive a free protection plan", "They are not entitled to every benefit", "They were chosen because of their past purchases"], "a": "C", "e": "Gói bảo hành 3 năm chỉ dành cho Elite → hạng Standard không có mọi quyền lợi."}, {"n": "174", "q": "Why are recipients asked to reserve early?", "o": ["A contract is scheduled to be signed", "Additional staff members need to be hired", "A guest list needs to be completed", "Space at the event is limited"], "a": "D", "e": "Chỗ ngồi và số nhân viên có hạn → không gian có hạn."}, {"n": "175", "q": "Who most likely is Mr. Briggs?", "o": ["A senior member of store staff", "A product technician", "A member of the floor sales team", "A customer in the loyalty program"], "a": "A", "e": "Store Manager → nhân sự cấp cao của cửa hàng."}]}, {"kind": "P7", "text": "Package\tDuration\tLocation\tImages or prints included\tPrice\nStudio Classic\t60 minutes\tMain studio\t8 digital images\t$180\nHeritage Portrait\t90 minutes\tOn location, outdoors\t12 digital images\t$320\nLens Basics\t4 weekly classes\tStudio classroom\tNone (course only)\t$150\nPrint Revival\tBy appointment\tDrop-off or by mail\tRestored prints returned\t$90\nGear Loan\tPer day\tPickup at main studio\tCamera and lens provided\t$45\nNote: On-location packages such as Heritage Portrait include travel to outdoor sites within the city. A meeting point is arranged with clients before the session date.\n----------------------\n\nFrom: gmarsh@selbyportrait.com\nTo: rosalind.pryce@mailhive.com\nSubject: Your portrait session\n\nDear Ms. Pryce,\n\nThank you for your message about arranging a family portrait outdoors. Based on the natural setting you described, I recommend our Heritage Portrait package. It is the only one of our sessions held entirely on location, which lets us capture the late-afternoon light you mentioned far better than any indoor room could.\n\nFor a session of this kind, clients do not come to our main studio on Fenwick Street. Instead, our team gathers everyone at the Ashgrove Park visitor center, and from there we walk together to the lakeside pavilion, where most of the pictures are taken. We can also begin at your home if you prefer, though the park offers a wider range of backgrounds. Please confirm your choice so that I may reserve the date.\n\nSincerely,\n\nGwen Marsh\nBooking Coordinator, Selby Portrait Studio", "qs": [{"n": "176", "q": "What is the Heritage Portrait?", "o": ["A training course", "A printing service", "A photography session", "An equipment rental"], "a": "C", "e": "Heritage Portrait là buổi chụp ảnh 90 phút ngoài trời."}, {"n": "177", "q": "What is indicated about the Heritage Portrait?", "o": ["It is the studio's least expensive option", "It provides restored photographs", "It runs over several weeks", "It is held away from the studio"], "a": "D", "e": "\"On location, outdoors\" / \"held entirely on location\" → diễn ra ngoài studio."}, {"n": "178", "q": "In the e-mail, the word 'capture' is closest in meaning to", "o": ["seize", "record", "charm", "gain"], "a": "B", "e": "capture the light = ghi lại (record) ánh sáng trong ảnh."}, {"n": "179", "q": "Why did Ms. Marsh write the e-mail?", "o": ["To recommend a service option to a customer", "To answer a coworker's question", "To confirm a completed booking", "To apologize for being unavailable"], "a": "A", "e": "Bà gợi ý gói Heritage Portrait cho khách → đề xuất dịch vụ."}, {"n": "180", "q": "Where will Ms. Pryce most likely meet the photography team?", "o": ["At the main studio on Fenwick Street", "At the lakeside pavilion", "At her own home", "At the Ashgrove Park visitor center"], "a": "D", "e": "\"our team gathers everyone at the Ashgrove Park visitor center\"."}]}, {"kind": "P7", "text": "https://www.larkfielddance.com/programs\n\nWelcome to Larkfield Dance Studio\n\nSince opening its doors in Cedar Valley, Larkfield Dance Studio has built its name on youth instruction. Every one of our current weekly classes serves students between the ages of six and seventeen, from first-time movers to competition-ready teens, and generations of local families have passed through our doors.\n\nMeet Your Instructor\n\nLorena Bassett joined the Larkfield team last year. Before turning to teaching, she danced with several touring companies across South America, and for the past eight years she has coached adult learners at community centers, guiding people who arrive with no experience at all. Warm and patient, she is known for putting nervous newcomers at ease within their first lesson.\n\nOur Space\n\nLarkfield occupies a bright, ground-floor studio on Maple Row. Our two mirrored rooms can each comfortably accommodate up to thirty dancers, the floors are sprung for safety, and a small lounge just off the entrance gives waiting families a comfortable place to sit.\n\nStarting Soon\n\nThis autumn we are opening a new evening course, Ballroom Basics, created for adults who are stepping onto the dance floor for the very first time. Beginning Monday, October 6, instructor Lorena Bassett will lead the group each Monday evening across an eight-week term. The term fee is $95. Places are limited, so early sign-up is encouraged.\n\n----------------------\n\nhttps://www.cedarvalleyliving.com/community\n\nGrown-Ups Finally Get Their Turn at Larkfield\n\nBy Damon Whitby | Cedar Valley Living | September 22\n\nFor years, Larkfield Dance Studio has been a familiar fixture for Cedar Valley's youngest dancers. This October, the Maple Row studio is trying something rather different: a beginners' course built entirely for adults, and one that its organizers hope will draw people who assumed their dancing days had passed them by.\n\nThe eight-week program, called First Steps on the Floor, begins Monday, October 6 and will be led by instructor Lorena Bassett. Aimed squarely at people who have never taken a dance class of any kind, the course walks students through the fundamentals of ballroom dancing at an unhurried pace. Organizers are also quick to note that no partner is required to sign up.\n\n\"So many adults tell me they have always wanted to try this, but they were afraid of being the only beginner in the room,\" said Bassett. \"This class is for exactly those people. Nobody here is expected to know a single step on day one.\"\n\nThe term costs $95, and registration is available only through the studio's website at www.larkfielddance.com.", "qs": [{"n": "181", "q": "What is indicated about Ms. Bassett?", "o": ["She was born in South America", "She has worked at the studio for eight years", "She taught adult students before joining the studio", "She specializes in teaching children"], "a": "C", "e": "8 năm dạy người lớn ở trung tâm cộng đồng trước khi về studio năm ngoái."}, {"n": "182", "q": "What is suggested about the new evening course?", "o": ["It is open to dancers of all ages", "It will be the studio's first class for adults", "It is intended for competition-level dancers", "It meets several times each week"], "a": "B", "e": "Mọi lớp hiện tại đều cho học sinh 6–17 tuổi → khóa tối này là lớp người lớn đầu tiên."}, {"n": "183", "q": "In the first Web page, the word \"accommodate\" is closest in meaning to", "o": ["oblige", "adapt", "satisfy", "hold"], "a": "D", "e": "accommodate up to thirty dancers = chứa được (hold)."}, {"n": "184", "q": "What is indicated about Larkfield Dance Studio?", "o": ["It accepts course sign-ups through its Web site", "It offers a discount for registering early", "It rents its rooms to the public", "It publishes a community magazine"], "a": "A", "e": "\"registration is available only through the studio's website\"."}, {"n": "185", "q": "What change was made to the adult beginners' course between the two Web pages?", "o": ["Its starting date was moved back", "It was given a different name", "Its focus was shifted to advanced technique", "A requirement to bring a partner was removed"], "a": "B", "e": "Trang 1 gọi là Ballroom Basics, trang 2 gọi là First Steps on the Floor → đổi tên."}]}, {"kind": "P7", "text": "To: All Staff\nFrom: Trevor Osei\nDate: February 24\nSubject: New employee commuter shuttle\n\nHello everyone,\n\nBeginning Monday, March 3, the Delmara Group will operate a morning commuter shuttle for staff, and I am pleased to say it will be offered at no cost to employees. The service was arranged to ease the pressure on our limited on-site parking and to give everyone a dependable alternative for the morning journey to work.\n\nTo reserve a seat, please register for one of the routes shown on the attached schedule no later than February 28. Seats on each route are limited, and they will be assigned in the order that requests are received.\n\nOn your very first journey, please show your employee identification badge to the route coordinator at the boarding point so that your name can be added to the daily passenger list. On every trip after that, the coordinator will simply check your name off the list before departure.\n\nThe attached schedule lists the boarding points that are available at launch. If none of them is close to your home, please write to our shuttle program administrator, who will look into adding a stop wherever there is enough demand.\n\nThank you,\nTrevor Osei\nFacilities Operations\n\n----------------------\n\nEmployee Commuter Shuttle Schedule\nProgram Administrator: Yolanda Pratt\n\nRoute\tCoordinator\tDeparture\tBoarding point\tSeats remaining\nNorthgate Express\tGregory Lund\t7:15 A.M.\tCorner of Fifth and Main\t3\nHarbor Line\tSimone Okafor\t7:30 A.M.\tCentral Station plaza\t0\nRiverside Loop\tMiriam Faulkner\t7:45 A.M.\tWillow Park entrance\t6\nParkview Route\tRaymond Tan\t8:00 A.M.\tGrand Avenue library\t2\n----------------------\n\nTo: Miriam Faulkner\nFrom: Dennis Achara\nDate: February 27\nSubject: Riverside Loop enrollment\n\nDear Ms. Faulkner,\n\nFollowing Mr. Osei's announcement about the new shuttle service, I have registered for the Riverside Loop and look forward to using it from Monday onward. I attended the short safety orientation for new riders yesterday afternoon at 4:30, so I am already familiar with the boarding procedure. Could you please confirm the exact departure time for the Riverside Loop, as I want to be certain I reach the boarding point with a few minutes to spare? I will also return my old parking permit to the security desk before the end of this week, since I will no longer need my reserved space.\n\nThanks,\nDennis Achara", "qs": [{"n": "186", "q": "According to the e-mail from Mr. Osei, what must employees do the first time they ride the shuttle?", "o": ["Add their own name to the passenger list", "Register for a route by February 28", "Check their name off the daily list", "Present their identification badge to a coordinator"], "a": "D", "e": "Lần đầu đi phải xuất trình thẻ nhân viên cho điều phối viên."}, {"n": "187", "q": "What does the e-mail indicate about the shuttle service?", "o": ["Their facilitators are department managers at Harrise Systems", "Seats are assigned according to seniority", "It is provided at no cost to staff", "It runs in both morning and evening"], "a": "C", "e": "\"offered at no cost to employees\"."}, {"n": "188", "q": "Whom should employees contact about a boarding point that is not currently offered?", "o": ["Ms. Pratt", "Mr. Lund", "Ms. Okafor", "Mr. Osei"], "a": "A", "e": "Liên hệ shuttle program administrator → Yolanda Pratt."}, {"n": "189", "q": "At what time does the route Mr. Achara selected leave its boarding point?", "o": ["7:15 A.M.", "7:30 A.M.", "7:45 A.M.", "4:30 P.M."], "a": "C", "e": "Riverside Loop khởi hành 7:45 A.M."}, {"n": "190", "q": "What does Mr. Achara indicate he still needs to do?", "o": ["Sign up for a shuttle route", "Return his parking permit", "Attend a safety orientation session", "Confirm a route's departure time"], "a": "B", "e": "Ông sẽ trả lại thẻ đỗ xe trước cuối tuần → việc còn phải làm. Đã đăng ký tuyến và đã dự buổi định hướng."}]}, {"kind": "P7", "text": "To: Julian Prescott\nFrom: Theresa Boland\nDate: September 3\nSubject: Venue proposals for the offsite meeting\n\nHi Julian,\n\nOur annual staff offsite meeting is set for October, and we need to settle on a location soon. Harriet Blaine will be coordinating the site visits and confirming availability once we have narrowed the list down.\n\nPlease contact the candidate venues on our shortlist and request a formal proposal from each one, using the comparison you put together for last year's meeting as a guide. Forward each proposal to Harriet as it comes in so that she can begin arranging visits. Once they are all in, combine them into a single comparison sheet for me. I plan to include it in the recommendation I am submitting to the chief operations officer.\n\nThanks,\n\nTheresa\n\n----------------------\n\nTo: Theresa Boland\nFrom: Julian Prescott\nDate: September 15\nSubject: Re: Venue proposals for the offsite meeting\nAttachment: Venue Comparison\n\nHi Theresa,\n\nThe proposals are all in now. According to Harriet Blaine, four of the six venues we contacted returned a completed proposal, which is a stronger response than we had for last year's meeting. The figures are broadly in line with what we saw then, although Harriet did point out one surprise: the daily rate quoted by one of the venues came in well below all of the others.\n\nThe full comparison is attached. Let me know if you need anything further before you send it on to Ms. Calloway, or whether she would also like copies of the original proposals.\n\nJulian\n\n----------------------\n\nVENUE PROPOSAL COMPARISON\nCompiled September 14\nVenue\tMaximum Capacity\tDaily Rate\tCatering Included\tEarliest Available Date\nHarborlight Conference Center\t250\t$2,600\tYes\tOctober 12\nMaple Crest Lodge\t180\t$1,750\tNo\tOctober 19\nStonebrook Pavilion\t120\t$1,900\tYes\tOctober 5\nWestgate Hall\t200\t$3,100\tNo\tOctober 26", "qs": [{"n": "191", "q": "In the first e-mail, what is indicated about Mr. Prescott?", "o": ["He will oversee the site visits.", "He will submit a recommendation to a senior executive.", "He has compiled a venue comparison before.", "He will lead the offsite meeting in October."], "a": "C", "e": "\"using the comparison you put together for last year's meeting\" → anh đã từng lập bảng so sánh."}, {"n": "192", "q": "What does Ms. Boland say she will do with the completed venue comparison?", "o": ["Include it in a recommendation", "Send it to the shortlisted venues", "Forward it to Ms. Blaine", "Use it to schedule site visits"], "a": "A", "e": "\"I plan to include it in the recommendation\"."}, {"n": "193", "q": "Who most likely is Ms. Calloway?", "o": ["The site visit coordinator", "The event logistics manager", "The head of human resources", "The chief operations officer"], "a": "D", "e": "Bà Boland sẽ gửi đề xuất cho chief operations officer; Julian hỏi trước khi gửi cho Ms. Calloway → bà là COO."}, {"n": "194", "q": "What does Mr. Prescott suggest about the venues that were contacted?", "o": ["The response was weaker than the previous year's.", "Not all of them submitted a proposal.", "One of them withdrew from consideration.", "They will be contacted again next year."], "a": "B", "e": "Chỉ 4/6 địa điểm gửi đề xuất → không phải tất cả đều gửi."}, {"n": "195", "q": "Which venue's daily rate most likely surprised Ms. Blaine?", "o": ["Maple Crest Lodge", "Stonebrook Pavilion", "Westgate Hall", "Harborlight Conference Center"], "a": "A", "e": "Giá ngày thấp hơn hẳn các nơi khác → Maple Crest Lodge $1,750."}]}, {"kind": "P7", "text": "To: Northgate Reel Rewards Members\nFrom: Lorna Fitzgerald\nSubject: Introducing Northgate Reel Rewards\nDate: March 12\nAttachment: Rewards Catalog\n\nDear Member,\n\nThank you for being part of the Northgate Cinemas community. We are pleased to introduce Northgate Reel Rewards, our new points-based program that lets you earn points on every ticket and concession purchase and exchange those points for a range of rewards.\n\nAll members begin at the Matinee level. At this level you earn one point for every dollar you spend, and you may redeem your points for any reward marked for Matinee members in the attached catalog.\n\nOnce you have spent three hundred dollars within a single calendar year, you are automatically moved up to the Marquee level. Marquee members earn two points for every dollar spent and may redeem their points for any reward marked for the Marquee level. They also enjoy one benefit reserved for this level alone: invitations to our members-only advance screenings, where you can watch selected films before they open to the general public.\n\nTo claim a reward, please review the attached catalog and confirm the points and level required for the item you want. Please note that each reward may be claimed only by members at the level shown beside it. Reply to this message with your choice, and we will verify your balance and arrange delivery or pickup.\n\nEnjoy the show,\n\nLorna Fitzgerald\nMembership Coordinator, Northgate Cinemas\n\n----------------------\n\nNorthgate Reel Rewards Catalog\nReward\tPoints Required\tEligible Level\tDelivery\nPopcorn and drink voucher\t200\tMatinee\tCollect at concession counter\nReusable beverage cup\t250\tMatinee\tCollect at concession counter\nCollector's film poster*\t350\tMarquee\tMailed to home address\nInsulated travel tumbler\t400\tMarquee\tMailed to home address\nFleece cinema blanket\t600\tMarquee\tMailed to home address\n* This reward is temporarily out of stock and cannot be claimed until it is restocked.\n----------------------\n\nTo: Lorna Fitzgerald\nFrom: Malcolm Reeves\nRe: Introducing Northgate Reel Rewards\nDate: March 15\n\nDear Ms. Fitzgerald,\n\nThank you for the information about the new program. I have been a Northgate member for about two years, and my account currently shows a balance of 450 points. Last month I attended one of the members-only advance screenings, which I thought was a wonderful benefit.\n\nI would very much like to claim the fleece cinema blanket from the catalog. Could you let me know whether my current balance is enough for it, and, if it is not, which reward I would be able to claim instead?\n\nThank you for your help,\n\nMalcolm Reeves", "qs": [{"n": "196", "q": "According to the first e-mail, what is true about the Marquee level?", "o": ["Members there earn points at a faster rate than other members.", "Members are placed there as soon as they join.", "Reaching it requires spending a set amount each month.", "Access to it requires payment of a separate fee."], "a": "A", "e": "Marquee kiếm 2 điểm/đô (Matinee 1 điểm) → tích điểm nhanh hơn."}, {"n": "197", "q": "According to the catalog, what do the rewards available to Marquee members have in common?", "o": ["They are sent to members by mail.", "They require the same number of points.", "They are all available to claim right now.", "They can be picked up at the concession counter."], "a": "A", "e": "Mọi phần thưởng Marquee đều \"Mailed to home address\". C sai vì poster đang hết hàng."}, {"n": "198", "q": "Why did Mr. Reeves write to Ms. Fitzgerald?", "o": ["To report a problem with his membership account", "To ask for more points to be added to his account", "To enroll in the new rewards program", "To determine which reward he is eligible to receive"], "a": "D", "e": "Hỏi điểm có đủ đổi chăn không, nếu không thì đổi được gì → xác định phần thưởng đủ điều kiện."}, {"n": "199", "q": "What is suggested about Mr. Reeves?", "o": ["He belongs to the Matinee level.", "He is employed by Northgate Cinemas.", "He has reached the Marquee level.", "He has already claimed a reward from the catalog."], "a": "C", "e": "Ông đã dự buổi chiếu sớm chỉ dành cho hạng Marquee → đã đạt hạng Marquee."}, {"n": "200", "q": "Which reward will Mr. Reeves most likely be able to claim?", "o": ["The collector's film poster", "The fleece cinema blanket", "The popcorn and drink voucher", "The insulated travel tumbler"], "a": "D", "e": "450 điểm: chăn cần 600 (không đủ), poster hết hàng, voucher/cốc chỉ cho Matinee → tumbler 400 điểm."}]}], "newv": [{"w": "ahead of", "m": "trước (thời hạn, ai đó)", "p": "cụm giới từ", "t": "Cụm từ & giới từ dùng chung mọi chủ đề"}, {"w": "aside from", "m": "ngoài ra, ngoại trừ", "p": "cụm giới từ", "t": "Cụm từ & giới từ dùng chung mọi chủ đề"}, {"w": "stroll", "m": "đi dạo", "p": "v", "t": "Du lịch, Đi lại & Lưu trú (Travel / Hotel)"}, {"w": "promenade", "m": "lối đi dạo", "p": "n", "t": "Du lịch, Đi lại & Lưu trú (Travel / Hotel)"}, {"w": "finally", "m": "cuối cùng", "p": "adv", "t": "Tính từ, trạng từ & từ thông dụng (General)"}, {"w": "promptly", "m": "ngay lập tức, kịp thời", "p": "adv", "t": "Tính từ, trạng từ & từ thông dụng (General)"}, {"w": "narrowly", "m": "suýt soát, sát nút", "p": "adv", "t": "Tính từ, trạng từ & từ thông dụng (General)"}, {"w": "thoroughly", "m": "kỹ lưỡng, triệt để", "p": "adv", "t": "Tính từ, trạng từ & từ thông dụng (General)"}, {"w": "directly", "m": "trực tiếp", "p": "adv", "t": "Tính từ, trạng từ & từ thông dụng (General)"}, {"w": "referral", "m": "sự giới thiệu, chuyển tiếp", "p": "n", "t": "Dịch vụ khách hàng & Khiếu nại (Customer Service)"}, {"w": "cramped", "m": "chật chội", "p": "adj", "t": "Cơ sở vật chất & Thiết bị (Facilities / Equipment)"}, {"w": "layout", "m": "cách bố trí, sơ đồ", "p": "n", "t": "Cơ sở vật chất & Thiết bị (Facilities / Equipment)"}, {"w": "under review", "m": "đang được xem xét", "p": "cụm giới từ", "t": "Cụm từ & giới từ dùng chung mọi chủ đề"}, {"w": "appraisal", "m": "sự định giá, thẩm định", "p": "n", "t": "Tài chính, Ngân hàng & Kế toán (Finance / Banking)"}, {"w": "barely", "m": "hầu như không, vừa đủ", "p": "adv", "t" ": "2", "q": "", "o": ["", "", "", ""], "a": "B", "e": "(A) A truck is being repaired. · (B) Some boxes are stacked on top of each other. · (C) A man is unloading a van. · (D) Some shelves are empty. — Các thùng hàng được xếp chồng lên nhau. Ảnh không có người → loại C (bẫy \"man\").", "svg": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"320\" height=\"180\" rx=\"14\" fill=\"#fff4e6\"/><rect y=\"130\" width=\"320\" height=\"50\" fill=\"#00000010\"/><text x=\"70\" y=\"120\" font-size=\"46\" text-anchor=\"middle\">📦</text><text x=\"70\" y=\"78\" font-size=\"46\" text-anchor=\"middle\">📦</text><text x=\"118\" y=\"120\" font-size=\"46\" text-anchor=\"middle\">📦</text><text x=\"240\" y=\"120\" font-size=\"64\" text-anchor=\"middle\">🚚</text></svg>", "script": [["N", "Number 2. Look at the picture marked number 2 in your test book."], ["N", "(A) A truck is being repaired."], ["N", "(B) Some boxes are stacked on top of each other."], ["N", "(C) A man is unloading a van."], ["N", "(D) Some shelves are empty."]]}, {"n": "3", "q": "", "o": ["", "", "", ""], "a": "A", "e": "(A) People are seated around a table. · (B) People are leaving the room. · (C) A projector is being installed. · (D) A man is writing on a whiteboard. — Mọi người đang ngồi quanh bàn họp. Không ai rời phòng hay viết bảng.", "svg": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"320\" height=\"180\" rx=\"14\" fill=\"#ebfbee\"/><rect y=\"130\" width=\"320\" height=\"50\" fill=\"#00000010\"/><text x=\"70\" y=\"95\" font-size=\"48\" text-anchor=\"middle\">🧑‍💼</text><text x=\"130\" y=\"95\" font-size=\"48\" text-anchor=\"middle\">👩‍💼</text><text x=\"190\" y=\"95\" font-size=\"48\" text-anchor=\"middle\">🧑‍💼</text><text x=\"265\" y=\"70\" font-size=\"48\" text-anchor=\"middle\">📊</text><text x=\"130\" y=\"140\" font-size=\"40\" text-anchor=\"middle\">🟫</text></svg>", "script": [["N", "Number 3. Look at the picture marked number 3 in your test book."], ["N", "(A) People are seated around a table."], ["N", "(B) People are leaving the room."], ["N", "(C) A projector is being installed."], ["N", "(D) A man is writing on a whiteboard."]]}, {"n": "4", "q": "", "o": ["", "", "", ""], "a": "A", "e": "(A) Some bicycles are parked in a row. · (B) A woman is riding a bicycle. · (C) Some trees are being cut down. · (D) A street is crowded with cars. — Các xe đạp được dựng thành một hàng. Không có người đạp xe, không có ô tô.", "svg": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"320\" height=\"180\" rx=\"14\" fill=\"#f8f0fc\"/><rect y=\"130\" width=\"320\" height=\"50\" fill=\"#00000010\"/><text x=\"50\" y=\"110\" font-size=\"70\" text-anchor=\"middle\">🌳</text><text x=\"130\" y=\"130\" font-size=\"44\" text-anchor=\"middle\">🚲</text><text x=\"180\" y=\"130\" font-size=\"44\" text-anchor=\"middle\">🚲</text><text x=\"230\" y=\"130\" font-size=\"44\" text-anchor=\"middle\">🚲</text><text x=\"280\" y=\"130\" font-size=\"44\" text-anchor=\"middle\">🚲</text></svg>", "script": [["N", "Number 4. Look at the picture marked number 4 in your test book."], ["N", "(A) Some bicycles are parked in a row."], ["N", "(B) A woman is riding a bicycle."], ["N", "(C) Some trees are being cut down."], ["N", "(D) A street is crowded with cars."]]}, {"n": "5", "q": "", "o": ["", "", "", ""], "a": "B", "e": "(A) A man is washing some dishes. · (B) A man is cooking in a kitchen. · (C) A man is setting a table. · (D) A man is ordering a meal. — Đầu bếp đang nấu ăn trong bếp. Các đáp án khác sai hành động.", "svg": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"320\" height=\"180\" rx=\"14\" fill=\"#fff9db\"/><rect y=\"130\" width=\"320\" height=\"50\" fill=\"#00000010\"/><text x=\"110\" y=\"115\" font-size=\"72\" text-anchor=\"middle\">👨‍🍳</text><text x=\"200\" y=\"118\" font-size=\"46\" text-anchor=\"middle\">🍳</text><text x=\"200\" y=\"150\" font-size=\"24\" text-anchor=\"middle\">🔥</text><text x=\"260\" y=\"118\" font-size=\"30\" text-anchor=\"middle\">🧂</text></svg>", "script": [["N", "Number 5. Look at the picture marked number 5 in your test book."], ["N", "(A) A man is washing some dishes."], ["N", "(B) A man is cooking in a kitchen."], ["N", "(C) A man is setting a table."], ["N", "(D) A man is ordering a meal."]]}, {"n": "6", "q": "", "o": ["", "", "", ""], "a": "B", "e": "(A) A plane is being cleaned. · (B) Some suitcases have been placed on a cart. · (C) Passengers are boarding a bus. · (D) A pilot is checking a map. — Vali đã được đặt lên xe đẩy (bị động hoàn thành – trạng thái). Không có hành khách, phi công.", "svg": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"320\" height=\"180\" rx=\"14\" fill=\"#e3fafc\"/><rect y=\"130\" width=\"320\" height=\"50\" fill=\"#00000010\"/><text x=\"240\" y=\"55\" font-size=\"50\" text-anchor=\"middle\">✈️</text><text x=\"90\" y=\"118\" font-size=\"44\" text-anchor=\"middle\">🧳</text><text x=\"140\" y=\"118\" font-size=\"44\" text-anchor=\"middle\">🧳</text><text x=\"115\" y=\"150\" font-size=\"40\" text-anchor=\"middle\">🛒</text></svg>", "script": [["N", "Number 6. Look at the picture marked number 6 in your test book."], ["N", "(A) A plane is being cleaned."], ["N", "(B) Some suitcases have been placed on a cart."], ["N", "(C) Passengers are boarding a bus."], ["N", "(D) A pilot is checking a map."]]}]}, {"kind": "L2", "title": "Part 2 – Question-Response (hỏi – đáp): nghe câu hỏi và 3 câu trả lời, không có chữ trong đề", "qs": [{"n": "7", "q": "", "o": ["", "", ""], "a": "A", "e": "\"When will the new printer be delivered?\" → (A) By Thursday afternoon. · (B) Yes, it prints in color. · (C) In the copy room. — Hỏi When → thời gian. B: Yes/No không trả lời câu hỏi Wh-. C trả lời Where.", "script": [["N", "Number 7."], ["W", "When will the new printer be delivered?"], ["M", "(A) By Thursday afternoon."], ["M", "(B) Yes, it prints in color."], ["M", "(C) In the copy room."]]}, {"n": "8", "q": "", "o": ["", "", ""], "a": "B", "e": "\"Who is in charge of the marketing budget?\" → (A) It's within our budget. · (B) Ms. Rivera, I think. · (C) A new advertising campaign. — Hỏi Who → người. A lặp từ \"budget\" (bẫy lặp âm).", "script": [["N", "Number 8."], ["M", "Who is in charge of the marketing budget?"], ["W", "(A) It's within our budget."], ["W", "(B) Ms. Rivera, I think."], ["W", "(C) A new advertising campaign."]]}, {"n": "9", "q": "", "o": ["", "", ""], "a": "A", "e": "\"Where should I put these files?\" → (A) On my desk, please. · (B) About two hundred pages. · (C) I filed a complaint yesterday. — Hỏi Where → nơi chốn. C bẫy từ đồng âm \"filed\".", "script": [["N", "Number 9."], ["W", "Where should I put these files?"], ["M", "(A) On my desk, please."], ["M", "(B) About two hundred pages."], ["M", "(C) I filed a complaint yesterday."]]}, {"n": "10", "q": "", "o": ["", "", ""], "a": "B", "e": "\"Why was the staff meeting postponed?\" → (A) At three o'clock. · (B) Because the director is sick. · (C) In conference room B. — Hỏi Why → lý do (Because…).", "script": [["N", "Number 10."], ["M", "Why was the staff meeting postponed?"], ["W", "(A) At three o'clock."], ["W", "(B) Because the director is sick."], ["W", "(C) In conference room B."]]}, {"n": "11", "q": "", "o": ["", "", ""], "a": "A", "e": "\"Would you like me to reserve a table for lunch?\" → (A) That would be great, thanks. · (B) A book about history. · (C) No, I didn't eat it. — Lời đề nghị giúp → chấp nhận/từ chối lịch sự. B bẫy \"book\" (đặt chỗ ≠ quyển sách).", "script": [["N", "Number 11."], ["W", "Would you like me to reserve a table for lunch?"], ["M", "(A) That would be great, thanks."], ["M", "(B) A book about history."], ["M", "(C) No, I didn't eat it."]]}, {"n": "12", "q": "", "o": ["", "", ""], "a": "A", "e": "\"How long does the flight to Tokyo take?\" → (A) About six hours. · (B) A round-trip ticket. · (C) From gate twelve. — How long → khoảng thời gian.", "script": [["N", "Number 12."], ["M", "How long does the flight to Tokyo take?"], ["W", "(A) About six hours."], ["W", "(B) A round-trip ticket."], ["W", "(C) From gate twelve."]]}, {"n": "13", "q": "", "o": ["", "", ""], "a": "A", "e": "\"Haven't you finished the sales report yet?\" → (A) I'm working on it now. · (B) Sales increased last year. · (C) Yes, I'll report the problem. — Câu hỏi phủ định → trả lời theo sự thật: đang làm. B, C lặp từ.", "script": [["N", "Number 13."], ["W", "Haven't you finished the sales report yet?"], ["M", "(A) I'm working on it now."], ["M", "(B) Sales increased last year."], ["M", "(C) Yes, I'll report the problem."]]}, {"n": "14", "q": "", "o": ["", "", ""], "a": "A", "e": "\"Should we hire more staff or use freelancers?\" → (A) Freelancers would be cheaper. · (B) Yes, he's much taller. · (C) The staff room is upstairs. — Câu hỏi lựa chọn (or) → chọn một phương án, không trả lời Yes/No.", "script": [["N", "Number 14."], ["M", "Should we hire more staff or use freelancers?"], ["W", "(A) Freelancers would be cheaper."], ["W", "(B) Yes, he's much taller."], ["W", "(C) The staff room is upstairs."]]}, {"n": "15", "q": "", "o": ["", "", ""], "a": "A", "e": "\"The shipment from our supplier hasn't arrived yet.\" → (A) I'll call the carrier. · (B) A ship in the harbor. · (C) Ten boxes, please. — Câu trần thuật nêu vấn đề → phản hồi bằng hành động giải quyết. B bẫy âm \"ship\".", "script": [["N", "Number 15."], ["W", "The shipment from our supplier hasn't arrived yet."], ["M", "(A) I'll call the carrier."], ["M", "(B) A ship in the harbor."], ["M", "(C) Ten boxes, please."]]}, {"n": "16", "q": "", "o": ["", "", ""], "a": "A", "e": "\"Can you show me how to use the new software?\" → (A) Sure, I'll come by after lunch. · (B) It's a new TV show. · (C) The software company in Seoul. — Lời nhờ vả (Can you…) → đồng ý/từ chối. B bẫy \"show\".", "script": [["N", "Number 16."], ["M", "Can you show me how to use the new software?"], ["W", "(A)  L.forEach(l=>{l=esc(l).replace(/--\((\d{3})\)--/g,'<b class="blank">($1) ______</b>').replace(/\((\d{3})\) -------/g,'<b class="blank">($1) ______</b>').replace(/— \[(\d)\] —|\[(\d)\]/g,(m,a,b)=>`<b class="mk">[${a||b}]</b>`);
  if(l.includes('\t')){tb.push(l);return}flush();if(/^-{6,}$/.test(l.trim()))o+='<hr>';else o+=l+'<br>'});flush();return o.replace(/(<br>){3,}/g,'<br><br>')};

const HDR=/^(From|To|Date|Subject|Sent|Re|Cc|Case Reference|Member|Reservation Reference|Collection Point|Pickup Date and Time|Return Date|Status|Name|E-mail|Telephone|Member organization|Confirmation reference|Issue date|Inquiries)\s*:/i;
const CHAT=/^(.{2,40}?)\s*\((\d{1,2}:\d{2}\s*[AP]\.?M\.?)\)\s*:\s*(.*)$/i;
function docType(s){if(/^From:|^To:/m.test(s))return 'Email';if(s.split('\n').filter(l=>CHAT.test(l.trim())).length>=2)return 'Tin nhắn';if(/\t/.test(s))return 'Bảng / biểu mẫu';if(/\(\w+ \d+\)\s*[—–-]|^\w+ \(\d+ \w+\)/m.test(s)||/^By /m.test(s))return 'Bài báo';if(/Form/i.test(s.split('\n')[0]))return 'Biểu mẫu';return 'Thông báo / quảng cáo'}
function inl2(l){return esc(l).replace(/--\((\d{3})\)--/g,'<b class="blank">($1) ______</b>').replace(/\((\d{3})\) -------/g,'<b class="blank">($1) ______</b>').replace(/— \[(\d)\] —|\[(\d)\]/g,(m,a,b)=>`<b class="mk">[${a||b}]</b>`)}
function fmtOne(src){const L=src.split('\n');let o='',i=0,hd='',tb=[],chat='';
 while(i<L.length&&!L[i].trim())i++;
 while(i<L.length&&(HDR.test(L[i].trim())||(!L[i].trim()&&hd&&i+1<L.length&&HDR.test(L[i+1].trim())))){const l=L[i].trim();if(l){const k=l.indexOf(':');hd+=`<span>${esc(l.slice(0,k))}</span><b>${esc(l.slice(k+1).trim())}</b>`}i++}
 if(hd)o+=`<div class="mh">${hd}</div>`;
 const flush=()=>{if(tb.length){o+='<div class="tw2"><table>'+tb.map((r,k)=>'<tr>'+r.split('\t').map(c=>k?`<td>${inl2(c)}</td>`:`<th>${inl2(c)}</th>`).join('')+'</tr>').join('')+'</table></div>';tb=[]}if(chat){o+=`<div class="chat">${chat}</div>`;chat=''}};
 let first=!hd;
 for(;i<L.length;i++){const l=L[i].trim();if(!l){flush();continue}
  const m=l.match(CHAT);if(m){if(tb.length)flush();chat+=`<div class="msg"><div class="who">${esc(m[1])} <i>${esc(m[2])}</i></div>${inl2(m[3])}</div>`;first=false;continue}
  if(L[i].includes('\t')){if(chat)flush();tb.push(L[i]);first=false;continue}
  flush();
  if(/^Questions \d+/.test(l)){o+=`<div class="ins">${esc(l)}</div>`;continue}
  if(first&&l.length<80&&!/[.,]$/.test(l)){o+=`<h4 class="dt">${inl2(l)}</h4>`;first=false;continue}
  first=false;
  if(/^(\d+\.|Step \d+:|[•\-]\s|\[[ x]\])/.test(l))o+=`<div class="li">${inl2(l)}</div>`;else o+=`<p>${inl2(l)}</p>`}
 flush();return o}
function fmtDocs(text,multi){const parts=text.split(/\n\s*-{6,}\s*\n/);return parts.map((p,k)=>`<div class="doc">${parts.length>1||multi?`<div class="lbl">Văn bản ${k+1} · ${docType(p)}</div>`:`<div class="lbl">${docType(p)}</div>`}${fmtOne(p)}</div>`).join('')}

 document.getElementById('ext').textContent=e.title;

 let q=`<div class="xtabs">${kinds.map(k=>`<button data-tab="${k}">Part ${k[1]}<small>${P[k].reduce((a,b)=>a+b.qs.length,0)} câu</small></button>`).join('')}</div>`,sh='',rq='';

    b.qs.forEach(x=>sh+=srow(x))})}
  q+='</div>'});

function tick(){const m=document.getElementById('exm');if(XS.score!=null){m.textContent='Đã nộp';m.classList.remove('late');return}
