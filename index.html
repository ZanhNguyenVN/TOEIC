ề quan hệ chủ động (who wish) → wishing."}]}, {"kind": "P6", "text": "Questions 131–134 refer to the following e-mail.\n\nTo: All Staff\nFrom: Karen Wu, Facilities Manager\nSubject: Parking lot repairs\n\nDear colleagues,\n\nStarting next Monday, the east parking lot will be closed for (131) -------. The work is expected to take two weeks. During this time, employees may park in the west lot or use the public garage on Fifth Street. The company (132) ------- the cost of parking at the garage. Simply keep your receipts and submit them with your monthly expense report.\n(133) -------. To reduce traffic, we encourage you to share rides with colleagues or take public transportation. (134) -------, please allow extra time for your commute.\n\nThank you for your patience.", "qs": [{"n": "131", "q": "", "o": ["repairs", "repaired", "repairing", "repairer"], "a": "A", "e": "Sau giới từ for cần danh từ → repairs."}, {"n": "132", "q": "", "o": ["reimbursed", "will reimburse", "was reimbursing", "has reimbursed"], "a": "B", "e": "Việc trong tương lai (sau khi bãi đóng cửa) → will reimburse."}, {"n": "133", "q": "", "o": ["The west lot has fewer spaces, so it may fill up quickly.", "The garage was built ten years ago.", "Our company was founded in 1998.", "The cafeteria will serve lunch as usual."], "a": "A", "e": "Câu sau nói \"để giảm giao thông, hãy đi chung xe\" → câu trước phải nêu vấn đề chỗ đỗ ít."}, {"n": "134", "q": "", "o": ["However", "For example", "In any case", "Instead"], "a": "C", "e": "\"Dù thế nào đi nữa\" hãy dự trù thêm thời gian → In any case."}]}, {"kind": "P6", "text": "Questions 135–138 refer to the following advertisement.\n\nGreenway Office Supplies – Spring Sale!\n\nFor a limited time, all office furniture is 20 percent off. Whether you need a new desk, a (135) ------- chair, or extra storage, we have it all. Orders over $200 also qualify for free (136) -------.\nOur store is open seven days a week. (137) -------. You can also shop online at greenwayoffice.com, where you will find our full catalog. Hurry – this offer (138) ------- on April 30!", "qs": [{"n": "135", "q": "", "o": ["comfort", "comfortable", "comfortably", "comforting"], "a": "B", "e": "Trước danh từ chair → tính từ."}, {"n": "136", "q": "", "o": ["shipping", "shipped", "ships", "shipper"], "a": "A", "e": "free shipping = miễn phí vận chuyển."}, {"n": "137", "q": "", "o": ["Our friendly staff will be happy to help you choose the right products.", "We are closed on weekends.", "The furniture was made in 2010.", "Please return the form by mail."], "a": "A", "e": "Câu trước \"mở cửa 7 ngày/tuần\" → B mâu thuẫn; A nối mạch về cửa hàng."}, {"n": "138", "q": "", "o": ["ended", "ends", "has ended", "ending"], "a": "B", "e": "Lịch trình cố định → hiện tại đơn (ends)."}]}, {"kind": "P6", "text": "Questions 139–142 refer to the following notice.\n\nNotice to All Tenants\n\nThe building management office would like to inform you that the fire alarm system will be (139) ------- on Thursday, May 12, between 10:00 A.M. and noon. During this period, alarms may sound several times. (140) -------. There is no need to leave the building unless a staff member instructs you to do so.\nWe apologize for any (141) -------. This test is required by city safety regulations and helps ensure that the system works properly. If you have questions, please contact the management office (142) ------- extension 205.", "qs": [{"n": "139", "q": "", "o": ["tested", "testing", "test", "tests"], "a": "A", "e": "Bị động: will be + V3."}, {"n": "140", "q": "", "o": ["Please do not be alarmed if you hear them.", "The building has twelve floors.", "New tenants will move in next month.", "The elevator was repaired yesterday."], "a": "A", "e": "Câu trước \"chuông có thể kêu nhiều lần\" → câu trấn an hợp lý nhất."}, {"n": "141", "q": "", "o": ["inconvenient", "inconvenience", "inconveniently", "inconvenienced"], "a": "B", "e": "apologize for any + danh từ."}, {"n": "142", "q": "", "o": ["at", "on", "in", "by"], "a": "A", "e": "Liên hệ ai đó at + số máy lẻ/số điện thoại."}]}, {"kind": "P6", "text": "Questions 143–146 refer to the following letter.\n\nDear Mr. Alvarez,\n\nThank you for your interest in the position of Accounting Assistant. We were impressed by your (143) ------- and would like to invite you to an interview on Tuesday, June 3, at 10:00 A.M.\nThe interview will last about one hour. You will meet with our finance director and a member of the human resources team. (144) -------, you will be asked to complete a short skills test.\nPlease (145) ------- your attendance by replying to this letter or calling our office. (146) -------. We look forward to meeting you.\n\nSincerely,\nLinda Park, HR Manager", "qs": [{"n": "143", "q": "", "o": ["qualify", "qualifications", "qualified", "qualifying"], "a": "B", "e": "Sau tính từ sở hữu your → danh từ."}, {"n": "144", "q": "", "o": ["In addition", "However", "Otherwise", "Even so"], "a": "A", "e": "Bổ sung thêm một phần nữa của buổi phỏng vấn → In addition."}, {"n": "145", "q": "", "o": ["confirm", "confirms", "confirmed", "confirming"], "a": "A", "e": "Câu mệnh lệnh: Please + V nguyên mẫu."}, {"n": "146", "q": "", "o": ["If this time is not convenient, we will be happy to reschedule.", "We hired a new director last year.", "The test results were excellent.", "Our office moved to Chicago in 2015."], "a": "A", "e": "Câu cuối thư mời phỏng vấn thường đưa phương án đổi lịch; C sai thời điểm (chưa làm bài test)."}]}, {"kind": "P7", "text": "Questions 147–148 refer to the following text message chain.\n\nPaul Kim (2:14 P.M.): Hi Mia, the printer on our floor is out of order again.\nMia Chen (2:16 P.M.): Oh no. Did you call technical support?\nPaul Kim (2:17 P.M.): Yes, but they can't come until tomorrow. I need to print 40 copies of the sales report for the 4 o'clock meeting.\nMia Chen (2:19 P.M.): You can use the one in the marketing department. I'll let them know you're coming.\nPaul Kim (2:20 P.M.): That would be great. Thanks!", "qs": [{"n": "147", "q": "What problem does Mr. Kim have?", "o": ["He lost a report", "A machine is not working", "A meeting was canceled", "He missed a phone call"], "a": "B", "e": "\"the printer… is out of order\" = máy không hoạt động."}, {"n": "148", "q": "At 2:20 P.M., what does Mr. Kim most likely mean when he writes, \"That would be great\"?", "o": ["He will attend the marketing meeting", "He accepts Ms. Chen's offer", "He wants a new printer", "He will call technical support again"], "a": "B", "e": "Đáp lại đề nghị dùng máy in phòng marketing → chấp nhận."}]}, {"kind": "P7", "text": "Questions 149–151 refer to the following article.\n\nRIVERTON (May 2) – Fresh Harvest, a regional grocery chain, announced yesterday that it will open its first store in Riverton this fall. The 3,000-square-meter store will be located on Main Street, in the building that previously housed a furniture outlet.\nAccording to company spokesperson Ana Silva, the new store will create about 60 full-time and part-time jobs. \"We are committed to hiring local residents,\" Ms. Silva said. Applications can be submitted online beginning June 1.\nFresh Harvest is known for its wide selection of organic produce and its popular loyalty program, which offers members discounts of up to 15 percent.", "qs": [{"n": "149", "q": "What is the article mainly about?", "o": ["A furniture sale", "The opening of a new store", "A change in management", "A recycling program"], "a": "B", "e": "Câu đầu: sẽ mở cửa hàng đầu tiên ở Riverton."}, {"n": "150", "q": "What is indicated about the building on Main Street?", "o": ["It was recently built", "It was used by another business", "It is owned by the city", "It will be renovated next year"], "a": "B", "e": "\"previously housed a furniture outlet\" = từng là cửa hàng nội thất."}, {"n": "151", "q": "According to the article, what will happen on June 1?", "o": ["The store will open", "Job applications will be accepted", "A loyalty program will start", "Prices will be reduced"], "a": "B", "e": "\"Applications can be submitted online beginning June 1\"."}]}, {"kind": "P7", "text": "Questions 152–154 refer to the following e-mail.\n\nTo: Daniel Ortiz <dortiz@mailbox.com>\nFrom: Customer Care <care@techhome.com>\nDate: March 18\nSubject: Your recent order #77412\n\nDear Mr. Ortiz,\n\nThank you for shopping at TechHome. We are sorry to hear that the wireless headset you received does not work properly. Since your purchase is still covered by our one-year warranty, you may choose either a full refund or a free replacement.\nTo return the item, please print the attached shipping label and drop off the package at any post office. There is no charge for this service. Once we receive the headset, your refund will be processed within five business days, or a replacement will be shipped immediately.\nAs a thank-you for your patience, we have also added a $10 voucher to your account, which can be used on your next purchase.\n\nSincerely,\nTechHome Customer Care", "qs": [{"n": "152", "q": "Why was the e-mail sent?", "o": ["To confirm a new order", "To respond to a problem with a product", "To advertise a new headset", "To request a payment"], "a": "B", "e": "Thư phản hồi việc tai nghe không hoạt động."}, {"n": "153", "q": "What is Mr. Ortiz asked to do?", "o": ["Visit a TechHome store", "Call customer care", "Mail the headset back", "Fill out a survey"], "a": "C", "e": "In nhãn gửi hàng và gửi tại bưu điện = gửi trả qua bưu điện."}, {"n": "154", "q": "What is NOT mentioned as something Mr. Ortiz will receive?", "o": ["A refund or replacement", "A $10 voucher", "Free return shipping", "An extended warranty"], "a": "D", "e": "Bài không nói gia hạn bảo hành. Dạng NOT phải dò từng đáp án."}]}, {"kind": "P7", "text": "Questions 155–159 refer to the following notice and e-mail.\n\n[Notice]\nWestfield Business Center – Meeting Room Rental\nRoom A: up to 10 people – $40 per hour\nRoom B: up to 25 people – $70 per hour (includes projector)\nRoom C: up to 60 people – $120 per hour (includes projector and sound system)\nAll rooms include free Wi-Fi. Catering can be arranged for an additional fee. Reservations must be made at least 48 hours in advance. Cancellations made less than 24 hours before the booking will be charged 50 percent of the rental fee.\n[E-mail]\nTo: bookings@westfieldbc.com\nFrom: Hannah Moore\nDate: October 3\nSubject: Room reservation\n\nHello,\nI would like to reserve a room for a training session on October 10 from 9:00 A.M. to 1:00 P.M. There will be 20 participants, and I will need a projector for my presentation. Could you also tell me whether you can provide coffee and pastries for the group? Please send me a confirmation and an invoice for the total cost.\nThank you,\nHannah Moore", "qs": [{"n": "155", "q": "What is true about all the meeting rooms?", "o": ["They include a projector", "They offer free Internet access", "They can hold 60 people", "They include catering"], "a": "B", "e": "\"All rooms include free Wi-Fi\"."}, {"n": "156", "q": "Which room will Ms. Moore most likely reserve?", "o": ["Room A", "Room B", "Room C", "She has not decided"], "a": "B", "e": "20 người + cần máy chiếu → Room B (tối đa 25, có projector). Câu nối 2 đoạn."}, {"n": "157", "q": "How much will Ms. Moore probably pay for the room?", "o": ["$160", "$280", "$480", "$70"], "a": "B", "e": "4 giờ × $70 = $280."}, {"n": "158", "q": "What does Ms. Moore ask about?", "o": ["Parking", "Food service", "Wi-Fi password", "Cancellation fees"], "a": "B", "e": "\"coffee and pastries\" = dịch vụ đồ ăn (catering)."}, {"n": "159", "q": "What would happen if Ms. Moore canceled on October 9 at noon?", "o": ["She would get a full refund", "She would pay half the fee", "She would pay nothing", "She would pay double"], "a": "B", "e": "Hủy dưới 24 giờ trước giờ đặt (9 A.M. 10/10) → trả 50%."}]}], "newv": []}}, {"id": "test2", "title": "Đề Reading số 2", "count": 100, "subs": [], "note": "", "exam": {"id": "test2", "title": "Đề Reading số 2", "blocks": [{"kind": "P5", "text": "", "qs": [{"n": "101", "q": "Throughout the onboarding program, new hires develop _____ habits that streamline their daily tasks.", "o": ["productive", "products", "produce", "produces"], "a": "A", "e": "Trước danh từ habits cần tính từ → productive (hiệu quả, năng suất)."}, {"n": "102", "q": "The building manager will not authorize ___ renovations until the annual budget has been finalized.", "o": ["between", "any", "whether", "which"], "a": "B", "e": "authorize any renovations = cho phép bất kỳ việc cải tạo nào; any đứng trước danh từ trong câu phủ định."}, {"n": "103", "q": "The recently expanded support team will _____ international clients across several different time zones.", "o": ["communicate", "assist", "cooperate", "collaborate"], "a": "B", "e": "assist + tân ngữ trực tiếp (assist clients). communicate/cooperate/collaborate phải có with."}, {"n": "104", "q": "Guests visiting the newly opened lounge at Glenwater Airport can enjoy a wide selection of _____ amenities before boarding.", "o": ["recreational", "reluctant", "eventual", "hopeful"], "a": "A", "e": "recreational amenities = tiện nghi giải trí. reluctant (miễn cưỡng), eventual (cuối cùng), hopeful (hy vọng) không hợp nghĩa."}, {"n": "105", "q": "Customers who visited the reopened Brindle bookshop last weekend seemed ____ by the expanded selection of titles.", "o": ["pleased", "pleasingly", "please", "pleasure"], "a": "A", "e": "seem + tính từ; pleased by = hài lòng với (cảm xúc của người → -ed)."}, {"n": "106", "q": "Attendees _____ register before noon will receive a printed name badge and a complimentary lunch voucher.", "o": ["whom", "whose", "whichever", "who"], "a": "D", "e": "Chỗ trống làm chủ ngữ của động từ register và thay cho người → who."}, {"n": "107", "q": "During the final stage of hiring, applicants at Crestline Consulting must provide three professional _____ who can speak to their qualifications.", "o": ["portfolios", "credentials", "references", "testimonials"], "a": "C", "e": "references = người tham chiếu, \"who can speak to their qualifications\" (người có thể xác nhận năng lực) → phải là người."}, {"n": "108", "q": "Ms. Delacroix has exceeded her monthly sales targets every quarter _____ transferring to the Ravensworth branch last spring.", "o": ["until", "since", "upon", "onto"], "a": "B", "e": "since + V-ing/mốc + hiện tại hoàn thành (has exceeded) → since transferring."}, {"n": "109", "q": "Mr. Osei _____ a daily report of each delivery to the regional office.", "o": ["posting", "was posted", "post", "posts"], "a": "D", "e": "Câu thiếu động từ chính, chủ ngữ số ít, thói quen hằng ngày → hiện tại đơn posts."}, {"n": "110", "q": "The selection committee will review three competing proposals before ___ on a final vendor.", "o": ["reporting", "deciding", "relying", "focusing"], "a": "B", "e": "decide on = quyết định chọn; sau giới từ before dùng V-ing → deciding."}, {"n": "111", "q": "The lobby elevators at Westland Tower will be unavailable this weekend _____ the maintenance crew must replace several worn cables.", "o": ["therefore", "due to", "because", "yet"], "a": "C", "e": "Sau chỗ trống là mệnh đề (the crew must replace…) → because. due to cần danh từ."}, {"n": "112", "q": "The garden center takes on extra staff every spring because demand for its plants and outdoor supplies tends to be strongly _____ throughout the year.", "o": ["seasonal", "periodic", "frequent", "brief"], "a": "A", "e": "demand tends to be seasonal = nhu cầu theo mùa (khớp \"every spring\")."}, {"n": "113", "q": "_____ that the new ticketing system has already been installed, visitors to the Halden Museum can enter the main galleries without waiting in line.", "o": ["Whereas", "Considering", "Provided", "Although"], "a": "B", "e": "Considering that = xét rằng/vì rằng (sự thật đã xảy ra). Provided that = miễn là (điều kiện) → không hợp."}, {"n": "114", "q": "The Verdano refrigerator combines a generous storage capacity with a _____ compact exterior.", "o": ["surprising", "surprisingly", "surprise", "surprises"], "a": "B", "e": "Bổ nghĩa cho tính từ compact → trạng từ surprisingly."}, {"n": "115", "q": "Thanks to the upgraded insulation at Elmwood Court, tenants reported noticeable _____ in their monthly heating costs throughout the winter.", "o": ["reductions", "increments", "provisions", "impressions"], "a": "A", "e": "Cách nhiệt tốt → chi phí sưởi giảm → reductions in costs."}, {"n": "116", "q": "Although the front desk can _____ requests immediately, every reservation must be confirmed by email.", "o": ["processes", "processed", "process", "processing"], "a": "C", "e": "Sau động từ khuyết thiếu can → V nguyên mẫu process."}, {"n": "117", "q": "Mr. Petrov confirmed that the brochures would be printed in time for _____ presentation.", "o": ["him", "he", "himself", "his"], "a": "D", "e": "Trước danh từ presentation → tính từ sở hữu his."}, {"n": "118", "q": "Responses entered into the system after the survey closed are not _____ in the totals displayed.", "o": ["reflect", "reflects", "reflected", "reflecting"], "a": "C", "e": "Câu bị động: are not + V3 (responses are not reflected = không được tính vào)."}, {"n": "119", "q": "The workshop developed by Ms. Renaud is recommended for _____ seeking to sharpen their presentation skills.", "o": ["which", "whose", "either", "those"], "a": "D", "e": "those + V-ing/who = những người (đang muốn cải thiện kỹ năng)."}, {"n": "120", "q": "After reviewing the strong turnout at last week's tasting event, the owners feel _____ confident that the new menu will succeed.", "o": ["fairly", "fair", "fairness", "fairest"], "a": "A", "e": "Bổ nghĩa cho tính từ confident → trạng từ fairly (khá)."}, {"n": "121", "q": "The store manager will contact each supplier this afternoon _____ the delayed shipments before the weekend sale.", "o": ["confirms", "had confirmed", "to confirm", "confirmation"], "a": "C", "e": "to + V chỉ mục đích: liên hệ nhà cung cấp để xác nhận."}, {"n": "122", "q": "Parcels left at the reception desk will be returned to their sender ____ they remain unclaimed after thirty days.", "o": ["as", "if", "so", "to"], "a": "B", "e": "Câu điều kiện: hàng sẽ bị trả lại nếu không có người nhận sau 30 ngày → if."}, {"n": "123", "q": "Since its launch in March, the redesigned QuickCart checkout page has produced a noticeable _____ in customer satisfaction.", "o": ["improve", "improving", "improved", "improvement"], "a": "D", "e": "Sau tính từ noticeable cần danh từ → improvement."}, {"n": "124", "q": "Timberline Hardware's new assembly guide has proven extremely _____ to customers tackling their first home improvement project.", "o": ["valuable", "value", "valuably", "valuation"], "a": "A", "e": "prove + tính từ (prove valuable to sb = hữu ích với ai); trước đó có extremely."}, {"n": "125", "q": "The supervisory role ____ the new sales division was created especially for Mr. Nakamura.", "o": ["in", "of", "on", "to"], "a": "A", "e": "role in a division = vai trò trong bộ phận."}, {"n": "126", "q": "The service clerk at Halbrook Tool Rental promised to process the deposit refund _____ five business days.", "o": ["after", "until", "over", "within"], "a": "D", "e": "within + khoảng thời gian = trong vòng 5 ngày làm việc."}, {"n": "127", "q": "Larkwing Travel is recognized _____ the region as a dependable provider of affordable holiday packages for busy families.", "o": ["between", "among", "toward", "throughout"], "a": "D", "e": "throughout the region = khắp khu vực."}, {"n": "128", "q": "Employees who wish to update _____ contact details should notify the personnel office before the end of the month.", "o": ["they", "themselves", "theirs", "their"], "a": "D", "e": "Trước danh từ contact details → tính từ sở hữu their."}, {"n": "129", "q": "Because the free airport shuttle departs every ten minutes throughout the day, guests _____ wait long for a ride to the terminal.", "o": ["nearly", "mostly", "kindly", "seldom"], "a": "D", "e": "Xe đưa đón 10 phút/chuyến → khách hiếm khi phải chờ lâu (seldom)."}, {"n": "130", "q": "Marlowe Retail Group, Inc., will be _____ its first customer loyalty program in June.", "o": ["collecting", "rewarding", "launching", "renewing"], "a": "C", "e": "launch a program = ra mắt chương trình."}]}, {"kind": "P6", "text": "Library Reopens\n\n(14 March)–The Ashcombe Public Library welcomed residents back on Monday, 11 March, following a renovation that lasted almost seven months. --(131)--. Its main reading room has been enlarged to seat nearly twice as many visitors as it did previously, and a quiet study area has been added on the upper level. The entire project was --(132)-- financed through a combination of municipal funds and private donations from local businesses. --(133)--, the library now provides a dedicated children's wing and expanded internet access on every floor. Staff members expect the newly modernized --(134)-- to serve the growing community for many years to come.", "qs": [{"n": "131", "q": "", "o": ["A used-book sale will be held in the lobby throughout the spring", "The library will close early on public holidays this year", "A nearby community center underwent similar work last year", "The renovation has transformed nearly every part of the building"], "a": "D", "e": "Câu sau mô tả chi tiết các khu vực được cải tạo → câu tổng quát \"cải tạo gần như mọi phần của tòa nhà\" mở đầu hợp lý."}, {"n": "132", "q": "", "o": ["larger", "largeness", "large", "largely"], "a": "D", "e": "Bổ nghĩa cho động từ financed → trạng từ largely (phần lớn)."}, {"n": "133", "q": "", "o": ["Instead", "As a result", "In addition", "Nevertheless"], "a": "C", "e": "Bổ sung thêm tiện ích (khu thiếu nhi, internet) → In addition."}, {"n": "134", "q": "", "o": ["facility", "appointment", "collection", "celebration"], "a": "A", "e": "modernized facility = cơ sở (thư viện) được hiện đại hóa."}]}, {"kind": "P6", "text": "Oakhurst Public Parking Garage: New Mobile Payment Option\n\nWe are pleased to announce that drivers at the Oakhurst Public Parking Garage can now pay for parking through our new mobile application, SpotSwift. Contactless payment has become remarkably --(135)-- among daily commuters, so we encourage every visitor to download the application today. Once it is installed and linked to a card, your parking fee --(136)-- automatically each time you leave through the exit lane. After every visit, the app will also send you a --(137)-- confirming the amount charged and the date of your stay. Cash and card payments will of course remain available at the pay stations near each exit. --(138)--.", "qs": [{"n": "135", "q": "", "o": ["popularity", "popular", "popularize", "popularly"], "a": "B", "e": "become + tính từ; remarkably bổ nghĩa cho tính từ popular."}, {"n": "136", "q": "", "o": ["is charging", "had been charged", "will be charged", "was charged"], "a": "C", "e": "Mỗi lần bạn rời bãi (tương lai, lặp lại), phí sẽ được trừ tự động → bị động tương lai will be charged."}, {"n": "137", "q": "", "o": ["receipt", "payment", "location", "reminder"], "a": "A", "e": "receipt confirming the amount charged = biên lai xác nhận số tiền."}, {"n": "138", "q": "", "o": ["The main garage entrance will be repainted during the coming public holiday weekend", "We sincerely appreciated your patience throughout last month's major renovations", "Monthly parking permits can now be purchased directly at the main office window", "Whichever payment method you prefer, our goal is to make parking here more convenient"], "a": "D", "e": "Câu kết tóm ý \"dù dùng cách thanh toán nào…\", nối với câu trước về tiền mặt/thẻ."}]}, {"kind": "P6", "text": "October 3\n\nBy Cora Whitfield\n\nSilver Fern Coffee Roasters has relocated its production to a larger facility at the northern edge of Halloway. --(139)--. That warehouse, which had stood empty for two years, offers roughly three times the roasting capacity of the company's original site. The added space now allows the roastery to process bulk orders that it once had to turn away. --(140)--, the business can supply several regional grocery chains that had requested larger volumes. Founder Dominik Farrow said the roastery --(141)-- to double its monthly output within a year. To keep pace with demand, the company has begun the --(142)-- of eight additional staff, with interviews scheduled for next week.", "qs": [{"n": "139", "q": "", "o": ["The founder first began roasting beans in a rented cafe kitchen", "It is the second time the roastery has moved in five years", "Construction of the new building will not be completed until spring", "The roastery has taken over a disused warehouse on Kestrel Road"], "a": "D", "e": "Câu sau mở đầu bằng \"That warehouse\" → câu trước phải nhắc tới nhà kho."}, {"n": "140", "q": "", "o": ["As a result", "In addition", "Nevertheless", "Meanwhile"], "a": "A", "e": "Có thêm không gian → kết quả là cung cấp được cho các chuỗi siêu thị → As a result."}, {"n": "141", "q": "", "o": ["convinces", "aims", "threatens", "admits"], "a": "B", "e": "aim to + V = đặt mục tiêu. convince không đi với to V như vậy; threatens/admits sai nghĩa."}, {"n": "142", "q": "", "o": ["recruiter", "recruitment", "recruits", "recruiting"], "a": "B", "e": "the + danh từ + of: the recruitment of eight staff = việc tuyển dụng 8 nhân viên."}]}, {"kind": "P6", "text": "Brightloft Coworking, located in the heart of Dunmore, is pleased to announce its new Flexible Desk membership, now open for enrollment. Unlike a traditional lease, this plan lets you pay only for the days you actually use, so your costs match your schedule. The membership --(143)-- members access to more than a dozen shared meeting rooms, along with fast internet and unlimited printing. During each visit, you and your colleagues can promote --(144)-- to the freelancers and founders working nearby.\n\nBecause demand is highest between nine and five, most members reserve a desk for only part of the --(145)--. Whether you are a freelancer, a remote employee, or the owner of a growing team, Brightloft has room for you. --(146)--.", "qs": [{"n": "143", "q": "", "o": ["delivers", "reserves", "grants", "rewards"], "a": "C", "e": "grant sb access to = cấp cho ai quyền sử dụng."}, {"n": "144", "q": "", "o": ["yourselves", "yourself", "your", "you"], "a": "A", "e": "you and your colleagues … promote yourselves (đại từ phản thân số nhiều, chủ ngữ là \"you and your colleagues\")."}, {"n": "145", "q": "", "o": ["week", "day", "building", "year"], "a": "B", "e": "between nine and five = khung giờ trong ngày → part of the day."}, {"n": "146", "q": "", "o": ["Our rooftop café will host a live jazz night with local musicians this coming Friday", "Attendance at our regular lunchtime workshops declined slightly over the last winter", "Enroll on our website in minutes, or drop by the front desk to begin your membership today", "This ground-floor lounge is by far the most spacious shared area in our building"], "a": "C", "e": "Câu cuối quảng cáo kêu gọi hành động: đăng ký ngay."}]}, {"kind": "P7", "text": "The Copper Kettle Cafe — Introducing the Kettle Club!\n\nMembership is completely free. Sign up at our front counter or through the Copper Kettle mobile app. The club offers two membership levels, each with its own rewards, as described below.\n\nEveryday Members\nEarn 5 points for every drink you buy.\nEnjoy a complimentary treat during your birthday month.\n\nSignature Members\nReceive a 10 percent discount on all bakery items.\nGet early access to each new seasonal menu.\n\nSignature Members may also order a personalized travel mug for a one-time charge of 12 dollars. Please note that points expire twelve months after they are earned.\n\nQuestions? Message us anytime through the app.", "qs": [{"n": "147", "q": "What is indicated about the Kettle Club?", "o": ["It gives all members a discount on baked goods", "It can be joined in more than one way", "It offers members a treat every month", "It lets members redeem points indefinitely"], "a": "B", "e": "Đăng ký \"at our front counter or through the mobile app\" → nhiều cách tham gia."}, {"n": "148", "q": "Which Kettle Club benefit is NOT provided at no cost?", "o": ["Points earned on drink purchases", "A customized travel mug", "A treat during a member's birthday month", "Early access to a new seasonal menu"], "a": "B", "e": "Cốc giữ nhiệt cá nhân hóa tính phí 12 đô một lần."}]}, {"kind": "P7", "text": "From: members@ashfieldrec.org\nTo: hcorbin@quickmail.net\nDate: March 3\nSubject: Temporary pool closure and how to keep swimming\n\nDear Ms. Corbin,\n\nWe are writing to let you know that the swimming pool at Ashfield Community Recreation Centre will be closed for a short period while essential maintenance is carried out on the water filtration system. The closure begins on March 10, and the pool will reopen on March 24.\n\nDuring this period, you are welcome to use Northbrook Leisure Pool, which is available to our members from 6:00 A.M. to 9:00 P.M. To swim there, simply present your membership reference, AC-40712, at the front desk, and staff will admit you straight away. Should you have any questions, please call our helpline at 555-0148.\n\nSincerely,\nAshfield Membership Team", "qs": [{"n": "149", "q": "Why was the e-mail sent to Ms. Corbin?", "o": ["To inform her that a facility will be out of use for a while", "To let her know that opening hours have changed", "To encourage her to join a new fitness program", "To confirm that her membership has been renewed"], "a": "A", "e": "Hồ bơi đóng cửa tạm thời để bảo trì → thông báo cơ sở không dùng được một thời gian."}, {"n": "150", "q": "What are members asked to do?", "o": ["Show their membership reference at the alternative pool", "Move permanently to the other branch", "Report a fault with the filtration system", "Telephone to book a replacement swim session"], "a": "A", "e": "\"present your membership reference at the front desk\" của hồ bơi Northbrook."}]}, {"kind": "P7", "text": "By Rosanne Villalobos\n\nTHISTLETON (6 February)—Larchmere Print and Packaging will move its operations to a larger site north of town, the firm confirmed this week. Its Wesley Street premises can no longer hold the presses needed to meet rising orders for folded cartons. The new building at Hollowbrook Industrial Park offers 4,200 square meters, nearly twice the present production area.\n\n\"We have been turning work away for want of room for a fourth press,\" said Ingrid Solberg, the operations manager. \"How orders are taken and handled will not alter, and no counter post will be lost.\"\n\nThe handover will proceed in three stages. In the first, beginning on 2 March, contractors will fit out the new building. In the second, from 20 April, company engineers will move the presses across, and although production will pause briefly, no order deadline will be affected. In the third, beginning on 1 June, the order collection point will transfer to Hollowbrook.\n\nOrdering by telephone or through the online portal remains unchanged, as do current prices and counter opening hours. The one difference for customers is that from the third stage, finished work must be collected at Hollowbrook rather than on Wesley Street.\n\nThe firm also plans to hire 12 production staff. Applications close on 21 February and should be sent to its personnel office.", "qs": [{"n": "151", "q": "When will the company's printing machinery be moved to Hollowbrook Industrial Park?", "o": ["On 21 February", "On 2 March", "On 20 April", "On 1 June"], "a": "C", "e": "Giai đoạn 2 từ 20/4: kỹ sư chuyển máy in sang."}, {"n": "152", "q": "According to the article, what will the firm's customers need to do differently?", "o": ["Send orders in by a different method", "Allow extra time for delayed deadlines", "Pick up finished items at another address", "Come to the counter at revised hours"], "a": "C", "e": "\"finished work must be collected at Hollowbrook\" → nhận hàng ở địa chỉ khác."}]}, {"kind": "P7", "text": "Marisol Duarte (2:10 P.M.): Hi Gregor, is the Prescott order finished? I checked it this morning but it wasn't ready.\n\nGregor Halloran (2:12 P.M.): Not quite. Everything is printed, but the covers still need laminating.\n\nMarisol Duarte (2:13 P.M.): Why is it behind?\n\nGregor Halloran (2:14 P.M.): The laminator jammed earlier and I had to stop and clean it out.\n\nMarisol Duarte (2:16 P.M.): I'll phone Mr. Prescott and explain the delay.\n\nGregor Halloran (2:17 P.M.): Good idea. Tell him he can collect it at the front counter by four o'clock.\n\nMarisol Duarte (2:18 P.M.): Will do, thanks. Can you have it done by then?\n\nGregor Halloran (2:19 P.M.): Sure, no trouble at all.", "qs": [{"n": "153", "q": "At 2:16 P.M., what does Ms. Duarte mean when she writes, \"I'll phone Mr. Prescott\"?", "o": ["She will announce a new store policy to a coworker", "She will thank Mr. Prescott for completing the work", "She will ask other staff to help with the order", "She will tell the customer the order is delayed"], "a": "D", "e": "Gọi cho khách để giải thích sự chậm trễ (explain the delay)."}, {"n": "154", "q": "What will Mr. Halloran most likely do next?", "o": ["Tidy the front counter", "Finish laminating the covers", "Check the order's status again", "Telephone the client himself"], "a": "B", "e": "Anh ấy hứa xong trước 4 giờ → sẽ hoàn tất ép bìa."}]}, {"kind": "P7", "text": "From: Lorna Beckett\nTo: All Third-Floor Staff\nDate: September 30\nSubject: Relocation to the Seventh Floor\n\nHello, everyone,\n\nOur department has grown steadily this year, and to give everyone more room we will be relocating from the third floor to the seventh floor on Saturday, October 5. The move itself will begin at 8 A.M. Please complete the following before you leave on Friday:\n\n1. Clear all personal items from your desk and cabinets by the end of the day on Friday, October 4.\n2. Pack your belongings into the boxes provided and flag any fragile items with a colored sticker.\n3. Label each box with your name and your new seat number.\n\nPlease note: The company will provide packing boxes, tape, and colored stickers at the third-floor reception desk. There is no need to purchase any of these materials yourself. I have also arranged for a professional moving crew to carry all furniture and equipment upstairs.\n\nFinally, please reply to this message by 5 P.M. on Friday, October 4, to confirm how many boxes you will need, so that we can distribute them in advance.\n\nThank you for your cooperation,\n\nLorna Beckett, Office Operations Manager", "qs": [{"n": "155", "q": "What is suggested about Ms. Beckett's department?", "o": ["It is currently located on the seventh floor.", "Its employees will move the furniture themselves.", "It has increased in size this year.", "It will spread across several floors."], "a": "C", "e": "\"Our department has grown steadily this year\" → đã tăng quy mô."}, {"n": "156", "q": "What does Ms. Beckett ask staff to do?", "o": ["Purchase their own packing materials.", "Carry the furniture to the new floor.", "Put a colored sticker on every box.", "Report how many boxes they need."], "a": "D", "e": "\"reply… to confirm how many boxes you will need\"."}, {"n": "157", "q": "The word \"flag\" in the list of steps is closest in meaning to", "o": ["wave", "weaken", "lower", "mark"], "a": "D", "e": "flag fragile items with a sticker = đánh dấu (mark)."}]}, {"kind": "P7", "text": "From: Ambrose Court Hotel\nTo: Nadia Kowalczyk\nDate: Tuesday, 24 September\nSubject: How was your stay?\n\nDear Ms. Kowalczyk,\n\nThank you for choosing Ambrose Court Hotel for your recent visit. We hope that the two nights you spent with us were comfortable and that everything met your expectations. We would value your feedback and invite you to complete a brief online survey that covers the main aspects of your stay. It should take no more than five minutes to finish.\n\nThe survey asks about the following:\n\nThe ease of the check-in and check-out process\nThe cleanliness and comfort of your room\nThe quality of the breakfast served each morning\nThe friendliness of our reception staff\nYour experience at our spa and wellness area\nTo take part, please follow these steps:\n\nClick the link at the bottom of this message.\nYou will be directed to our survey partner, OpinionStream, where you can enter your booking reference.\nAnswer each question and select \"Submit\" when you have finished.\nAs a thank-you, every guest who submits the survey by 15 October will receive a voucher for 20 percent off a future stay. The voucher is valid for six months and cannot be used together with our seasonal rate reductions. A new guest loyalty program will also be introduced later this year, and voucher holders will be enrolled in it at no cost.\n\nWith warm regards,\nMiriam Halstead\nGuest Relations Manager, Ambrose Court Hotel", "qs": [{"n": "158", "q": "Who most likely is Ms. Kowalczyk?", "o": ["A member of the hotel's staff", "An employee of the survey provider", "A professional in the travel industry", "A recent guest of the hotel"], "a": "D", "e": "Thư cảm ơn đã lưu trú → khách vừa ở khách sạn."}, {"n": "159", "q": "The word 'covers' in paragraph 1, line 4, is closest in meaning to", "o": ["conceals", "travels", "pays for", "addresses"], "a": "D", "e": "survey that covers the main aspects = đề cập tới (addresses)."}, {"n": "160", "q": "What does the e-mail suggest about Ambrose Court Hotel?", "o": ["It offers reduced rates during certain seasons.", "It has run a loyalty program for years.", "It does not have a spa area.", "It rewards every guest with a future discount."], "a": "A", "e": "Voucher không dùng chung với \"our seasonal rate reductions\" → khách sạn có giảm giá theo mùa. D sai vì chỉ khách làm khảo sát mới được."}]}, {"kind": "P7", "text": "HARTWELL (12 September)— The Hartwell Growers' Market is opening a second trading location to keep up with rising demand. — [1] —. Over the past year, the Saturday market has welcomed an average of more than 4,000 shoppers each week, roughly double the number recorded two years earlier.\n\nThe market has operated on Meadow Street for eight years, where 25 stalls sell fresh produce, baked goods, and crafts every Saturday morning. Organizers say the growth is largely the result of several new farms joining from the surrounding valley, which has widened the range of goods on offer and drawn visitors from neighboring towns.\n\nTo ease the crowding, a second market will open at Cranford Square, close to the town's central bus stop. — [2] —. The new site will run on Wednesdays and Thursdays from 9 a.m. to 3 p.m., with room for up to 40 stalls, and sellers will pay a rental fee of 20 dollars per day.\n\n\"The weekday market means that people who work on weekends can finally buy fresh vegetables and bread from local producers,\" said Beatrice Nolan, director of the Hartwell Community Market Association. — [3] —. Samuel Ortega, who sells honey and preserves at the Meadow Street site, added that the extra days would help him reach customers he had never met before.\n\nThe association hopes to add a covered seating area for the colder months and is already considering a third location on the eastern edge of town. — [4] —.", "qs": [{"n": "161", "q": "What is the main purpose of the article?", "o": ["To explain a single fee charged to participating sellers", "To report a broad trend affecting markets across the region", "To examine why additional farms have joined the market", "To announce a popular market's opening of a second site"], "a": "D", "e": "Bài báo thông báo chợ mở địa điểm thứ hai."}, {"n": "162", "q": "According to the article, what does the new weekday market allow some shoppers to do?", "o": ["Sell their goods to a wider group of buyers", "Rent a stall at a reduced weekend rate", "Buy fresh local food on days they are not working", "Purchase produce from farms in the surrounding valley"], "a": "C", "e": "Người làm cuối tuần có thể mua thực phẩm tươi vào ngày thường (ngày họ không làm việc)."}, {"n": "163", "q": "In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"Its position beside the busy transport hub is expected to make the site easy to reach for people traveling to and from work.\"", "o": ["[1]", "[2]", "[3]", "[4]"], "a": "B", "e": "Câu chèn nói về vị trí cạnh trạm giao thông → đặt sau câu \"close to the town's central bus stop\" ở [2]."}]}, {"kind": "P7", "text": "Home | How It Works | Membership | Report a Problem\n\nCastleford Bike Share\n\nTwo Wheels, One City\n\nCastleford Bike Share lets residents borrow a bicycle from one docking station and leave it at any other. Bikes are available around the clock at more than 40 docking stations spread across the city, and stations are checked and restocked each morning. Renting a bike takes only a few minutes, and the steps below guide first-time riders through a trip from start to finish.\n\nHow It Works\n\nStep 1: Create an account online and choose a plan.\nStep 2: At any station, tap your member card at the kiosk. The kiosk is run entirely by the app, so no staff are on site.\nStep 3: Take the unlocked bike and ride wherever you like. The first 45 minutes of every trip are free, and longer trips add a small charge.\nStep 4: Return the bike to any open dock and press the lock button to end your trip.\n\nMembership is open to riders who are at least 16 years old. Registration is completed entirely online, and each member unlocks bikes using either the member card or the mobile app.\n\nReport a Problem\n\nIf a bike is damaged or a dock will not release, open the app and tap the Report a Fault button to send us a short online form. Our team reviews these reports throughout the day. To recover a lost item, telephone the operations center during office hours.", "qs": [{"n": "164", "q": "In the How It Works section, the word \"run\" is closest in meaning to", "o": ["operated", "moved", "printed", "continued"], "a": "A", "e": "The kiosk is run entirely by the app = được vận hành (operated)."}, {"n": "165", "q": "What is NOT stated about riders?", "o": ["They must meet a minimum age.", "They sign up over the internet.", "They can unlock a bike with a card or a phone app.", "They ride as part of a group."], "a": "D", "e": "Không nói người đạp xe đi theo nhóm. A, B, C đều có trong bài."}, {"n": "166", "q": "What is indicated about Castleford Bike Share?", "o": ["It is hiring new staff.", "It sells bicycles to its members.", "It services its docking stations every day.", "It runs offices in several parts of the city."], "a": "C", "e": "\"stations are checked and restocked each morning\" → bảo trì trạm mỗi ngày."}, {"n": "167", "q": "According to the page, how can a rider report a damaged bike?", "o": ["By filling out a printed form", "By submitting a form in the mobile app", "By sending an e-mail", "By telephoning the operations center"], "a": "B", "e": "Mở app, bấm Report a Fault để gửi form trực tuyến."}]}, {"kind": "P7", "text": "From: Coralie Fenwick\nTo: Bernard Colton\nSubject: Service Visit Confirmation\nDate: 6 June\n\nCase Reference: SV-20418\n\nDear Mr. Colton,\n\nThank you for contacting us about the two-door convection oven that has stopped reaching its set temperature during service. — [1] —. We understand how disruptive a fault like this can be, and we have arranged an inspection for you as soon as possible. — [2] —. Your appointment is confirmed for Thursday, 12 June, with arrival expected between 8:00 A.M. and 10:00 A.M., and the visit will be carried out by Owen Radcliffe. — [3] —. The inspection usually takes about ninety minutes.\n\nBefore he arrives, please clear the area around the oven so that the unit can be reached easily, and make sure a member of your staff is present to describe the fault and to confirm your opening hours. Doing so will help us finish the work with the least possible disruption to your kitchen and your customers.\n\nA call-out charge of 65 dollars applies; however, this charge will be waived if the oven is still covered by the manufacturer's warranty. — [4] —.\n\nIf you have any questions before the visit, please feel free to reply to this message.\n\nKind regards,\n\nCoralie Fenwick\nBrightpan Commercial Kitchen Services", "qs": [{"n": "168", "q": "Who most likely is Mr. Colton?", "o": ["An equipment repair technician", "An appliance manufacturer", "A service coordinator", "A restaurant operator"], "a": "D", "e": "Lò nướng thương mại, \"your kitchen and your customers\" → chủ nhà hàng."}, {"n": "169", "q": "What problem did Mr. Colton report?", "o": ["An error on a recent service invoice", "An oven that fails to reach the correct temperature", "A conflict with the scheduled appointment time", "A problem with the manufacturer's warranty coverage"], "a": "B", "e": "Lò \"stopped reaching its set temperature\"."}, {"n": "170", "q": "What is Mr. Colton asked to do before the visit?", "o": ["Ensure the equipment is accessible and a staff member is available", "Carry out the necessary repair work without assistance", "Pay the full call-out charge ahead of the visit", "Renew the oven's warranty with the manufacturer"], "a": "A", "e": "Dọn khu vực quanh lò và có nhân viên có mặt."}, {"n": "171", "q": "In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"He will bring the replacement parts most commonly required for this type of fault.\"", "o": ["[1]", "[2]", "[3]", "[4]"], "a": "C", "e": "\"He\" chỉ Owen Radcliffe → câu chèn đứng ngay sau câu nêu tên anh ấy ở [3]."}]}, {"kind": "P7", "text": "Thornhedge Nursery Welcomes Visitors to Its Second Store\n\nARDENFORD (14 March) - Thornhedge Nursery, a family-run garden business known across the region for its wide selection of shrubs and flowering plants, has opened a second store on Wexley Lane in Ardenford.\n\nThe business began eleven years ago as a single stall selling potted herbs at a weekend market. Yvonne Castellan, who started Thornhedge and continues to oversee its day-to-day operations, said the company's steady growth had come from modest beginnings. \"We had only a small table and a few dozen plants when we opened,\" she recalled. \"Every step since then has been guided by what our customers ask us for, and this new store is the clearest sign yet of how far that has taken us.\"\n\nThe Ardenford store occupies a converted warehouse and features a bright indoor display hall, a covered courtyard for larger trees, and a separate room set aside for teaching. Wide aisles allow visitors to move easily between the seasonal arrangements, and a central advice counter is staffed throughout the day so that shoppers can ask about plant care before they buy.\n\nThe new location also introduces a program of hands-on planting workshops, something the first store was never able to accommodate. Sessions are held twice each week, and each one is limited to sixteen participants so that staff can give individual attention. Topics range from container gardening to the care of indoor foliage.\n\nThe store is open every day except Tuesday, from nine in the morning until six in the evening. General entry carries no charge, and throughout the opening month the nursery is offering each visitor a complimentary young seedling to take home.\n\n\"A garden center should be a place where people feel welcome to learn, not only to buy,\" Ms. Castellan said. \"I hope this store gives our neighbours somewhere to spend an afternoon and to leave with something they have grown themselves.\"", "qs": [{"n": "172", "q": "Where would the article most likely appear?", "o": ["In a gardening supply catalog", "In a horticultural training manual", "On a real estate listings Web site", "In a local community newspaper"], "a": "D", "e": "Tin khai trương cửa hàng địa phương, có ngày tháng và địa danh → báo cộng đồng."}, {"n": "173", "q": "The word 'recalled' in paragraph 2, line 4, is closest in meaning to", "o": ["returned", "withdrew", "remembered", "summoned"], "a": "C", "e": "recalled = nhớ lại (remembered)."}, {"n": "174", "q": "What is indicated about Ms. Castellan?", "o": ["She personally teaches the planting workshops", "She expects the workshop program to expand", "She once worked as a professional gardener", "She established the nursery herself"], "a": "D", "e": "\"Yvonne Castellan, who started Thornhedge\" → bà tự thành lập."}, {"n": "175", "q": "What is suggested about the Ardenford store?", "o": ["It has begun selling many new product categories", "Some visitors can receive a plant at no charge", "It guarantees each visitor a place in a workshop", "Its new building still requires renovation"], "a": "B", "e": "Trong tháng khai trương mỗi khách được tặng cây giống miễn phí → một số khách (khách tháng đầu)."}]}, {"kind": "P7", "text": "Brayton Theatre Company Unveils Ambitious New Season\n\nRegional troupe reports record attendance as it prepares to expand\n\nMILLBROOK (July 18)—The Brayton Theatre Company will raise the curtain on its new season on September 12 with a fresh slate of six productions. Patrons are encouraged to reserve their seats without delay through the company's website at www.braytontheatre.org/season, where the complete performance schedule has been posted.\n\nThe announcement follows a period of remarkable growth. Attendance at Brayton performances has risen by roughly forty percent over the past four seasons, a trend the company attributes to its broadened programming and its lower ticket prices. \"We have watched our audience grow steadily year after year, and this season is our way of thanking them for their loyalty,\" said artistic director Colette Ramsay.\n\nTo accommodate the larger crowds, Brayton will open a second performance space, the Pennington Stage, next season at the northern end of the Millbrook Arts District. Until that facility is ready, every production will continue to be staged at the company's existing home, the Aldridge Stage, at the southern end of the district.\n\n----------------------\n\nBECOME A BRAYTON SUBSCRIBER\n\nThis season, the Brayton Theatre Company is introducing three subscription plans, each offering a different combination of tickets and benefits for the year ahead. Compare the plans below to find the one that suits you best.\n\nPlan\tAnnual Price\tIncluded Benefits\nCurtain\t$60\tTickets to any two productions of your choice; a printed season newsletter\nEncore\t$120\tTickets to four productions; ten percent off any additional tickets; an invitation to the opening-night reception\nPremiere\t$220\tTickets to all six productions; an invitation to the opening-night reception; a guided backstage tour; priority reserved seating on the new Pennington Stage\nTo enroll, visit www.braytontheatre.org/season and enter the promotion code LAUNCH25 at checkout to lock in the introductory rate, which is available only through August 31. Subscribers who wish to bring companions may also add guest passes at $15 each. All reception guests are invited to gather in the lobby of the Aldridge Stage at 6:30 p.m. on September 12, before the opening performance begins.", "qs": [{"n": "176", "q": "What does the article encourage patrons to do?", "o": ["Review the newly posted schedule", "Enroll in a subscription plan", "Purchase discounted tickets", "Book seats on the theater's website"], "a": "D", "e": "\"reserve their seats… through the company's website\"."}, {"n": "177", "q": "According to the article, what has recently become larger?", "o": ["The number of people attending performances", "The number of productions offered", "The company's ticket prices", "The number of performance venues"], "a": "A", "e": "Số người xem tăng khoảng 40%."}, {"n": "178", "q": "What is true about some of the people who will attend the opening-night reception?", "o": ["They must reply to a confirmation e-mail", "They each paid $220 to subscribe", "They will travel to the southern end of the district", "They must be residents of Millbrook"], "a": "C", "e": "Tiệc ở sảnh Aldridge Stage, nằm ở đầu phía nam của khu → khách sẽ đến đầu phía nam. B sai vì gói Encore $120 cũng được mời."}, {"n": "179", "q": "What will happen at 6:30 P.M. on September 12?", "o": ["Reception guests will gather in a lobby", "The first performance will begin", "The introductory rates will expire", "A backstage tour will take place"], "a": "A", "e": "6:30 p.m. ngày 12/9 khách dự tiệc tập trung ở sảnh."}, {"n": "180", "q": "What is implied about the priority seating included with the Premiere plan?", "o": ["It can be used during the coming season", "It will not be available until next season", "It is included with the lowest-priced plan", "It applies to seating at the Aldridge Stage"], "a": "B", "e": "Ghế ưu tiên ở Pennington Stage, sân khấu mùa sau mới mở → chưa dùng được mùa này."}]}, {"kind": "P7", "text": "Bracken Hill Conference Centre\n\nWe are pleased to tell members that reserving a meeting room at Bracken Hill is about to become far simpler. Our new online booking service, the ReserveHub portal, lets your organization view available rooms and request a booking at any hour of the day, without telephoning our front desk or visiting reception. The portal will open to all member organizations on 3 March. From that day onward, every meeting-room request must be made through the portal. Requests will no longer be accepted by telephone or in person at reception.\n\nTo secure a room, sign in to the portal using your member account, choose a room category and an event date, and then enter the number of people expected and the time slot you require. When you submit the request, the system records it and sends a confirmation summary to your registered email address, setting out the outcome of each request you have made. Catering and audio equipment may be arranged as optional extras at the time of booking.\n\nPlease submit each request at least five business days before the event date. Requests received later than this cannot be confirmed. Members may book rooms for up to forty people directly through the portal. Any event expected to draw more than forty people requires separate written approval from our events team before the booking will stand.\n\nAny questions may be sent to the Member Services Desk. Please contact Devan Marsh at the desk for help with your account or with your first reservation.\n\n----------------------\n\nBracken Hill Conference Centre\nBooking Confirmation Summary\nMember organization: Kelvary Trade Guild\nConfirmation reference: CR-4820\nIssue date: 21 March\nInquiries: Member Services Desk (Devan Marsh)\n\nRequest submitted\tEvent date\tRoom\tTime slot\tExpected attendees\tStatus\n10 March\t24 March\tRowan Room\t9:00 a.m. to 11:00 a.m.\t18\tConfirmed\n12 March\t28 March\tCedar Suite *\t1:00 p.m. to 4:00 p.m.\t32\tConfirmed\n11 March\t27 March\tJuniper Hall\t10:00 a.m. to 3:00 p.m.\t60\tConfirmed\n20 March\t24 March\tAlder Room\t2:00 p.m. to 4:00 p.m.\t25\tConfirmed\n17 March\t4 April\tBirch Boardroom\t9:00 a.m. to 12:00 p.m.\t40\tConfirmed\n* Catering has been arranged for this booking. Reservations that do not meet the conditions set out in the member bulletin, including the five-business-day requirement, will be withdrawn without further notice. Please keep this summary for your records.", "qs": [{"n": "181", "q": "According to the notice, what will happen on 3 March?", "o": ["The center will begin offering catering to members", "A new events team will be formed", "A confirmation summary will be emailed to every member", "An online booking service will become available"], "a": "D", "e": "Cổng ReserveHub mở cho thành viên từ 3/3."}, {"n": "182", "q": "What is indicated about meeting-room requests?", "o": ["They can be submitted only online", "They must be made at least two days in advance", "They are handled in person at the service desk", "They need approval from the events team"], "a": "A", "e": "Từ 3/3 mọi yêu cầu phải qua cổng trực tuyến, không nhận qua điện thoại/trực tiếp."}, {"n": "183", "q": "In the notice, the word \"draw\" is closest in meaning to", "o": ["illustrate", "select", "withdraw", "attract"], "a": "D", "e": "draw more than forty people = thu hút (attract) hơn 40 người."}, {"n": "184", "q": "For which room will the Kelvary Trade Guild's booking most likely NOT be honored?", "o": ["Alder Room", "Cedar Suite", "Juniper Hall", "Birch Boardroom"], "a": "A", "e": "Alder Room: gửi 20/3 cho sự kiện 24/3 → chưa đủ 5 ngày làm việc → bị hủy."}, {"n": "185", "q": "What did the Kelvary Trade Guild most likely do?", "o": ["It obtained written approval for a large event", "It reserved a room by telephoning the front desk", "It arranged catering for all of its bookings", "It canceled one of its reservations"], "a": "A", "e": "Juniper Hall 60 người (>40 cần phê duyệt văn bản) vẫn được xác nhận → họ đã xin được phê duyệt."}]}, {"kind": "P7", "text": "Foxglove Craft Supply Invites Shoppers to the Workbench\n\nSeptember 20 — For more than forty years, Foxglove Craft Supply has sold yarn, paint, clay, and countless other materials to the makers of Denbury. In all that time, however, the shop has never once offered guided classes of its own. That is about to change. Beginning next month, the store will run The Maker Sessions, a series of hands-on workshops in which shoppers can learn a new craft from start to finish and walk out with something they have made themselves.\n\nDelia Faust, who manages events at the store, said the idea came from customers themselves. \"People buy the supplies and then tell us they are not quite sure where to begin,\" she said. \"We wanted to give them a place to sit down, try something, and leave with a finished piece they made by hand.\"\n\nTo introduce the program, Foxglove will hold a free preview afternoon on Saturday, October 5, when visitors can watch short demonstrations and ask questions at no cost. The paid sessions themselves begin on Saturday, October 19. Places are limited, and customers are encouraged to reserve a spot in advance, either through the store's Web page or at the customer desk.\n\n----------------------\n\nThe Maker Sessions — Registration Form\n\nPlease complete this form to reserve your place at a workshop.\n\nName: Rosalind Pryce\nDate: October 6\nE-mail: r.pryce@brightmail.com\nTelephone: (555) 0148\n\nPlease check your preferred session time (one only):\n[ ] Saturday, October 19 — 10:00 a.m.\n[x] Saturday, October 19 — 2:00 p.m.\n[ ] Saturday, October 26 — 10:00 a.m.\n[ ] Saturday, October 26 — 2:00 p.m.\n\nPlease rate your crafting experience (1 = I have never tried, 5 = very experienced):\n( 1 ) 2 3 4 5\n\nWhat do you hope to make or learn?\nI would love to learn how to make my own scented candles to give as gifts. I have never made anything like this by hand before, so I am really starting from the very beginning.\n\nHow did you hear about The Maker Sessions?\nMy aunt has been attending candle-making and pottery workshops for years and is always talking about how much she enjoys them. When she heard that Foxglove was finally starting its own, she told me right away that I should sign up.\n\n----------------------\n\nThe Maker Sessions: Fall Workshop Guide\n\nNot sure which workshop to choose? The guide below sets out this fall's four sessions side by side, so you can see at a glance which one suits you best. Every session in The Maker Sessions includes all the materials you will need, so you can simply show up and start creating.\n\nSession\tWhat you make\tRecommended level\tLength\nHand-Poured Candles\tScented pillar candles\tBeginner\t90 minutes\nSculptural Candle Techniques\tLayered decorative candles\tAdvanced\t2.5 hours\nIntroduction to Pottery\tA small clay bowl\tBeginner\t2 hours\nHandmade Gift Cards\tA set of greeting cards\tIntermediate\t90 minutes", "qs": [{"n": "186", "q": "What is the purpose of the article?", "o": ["To announce that two shops have combined", "To introduce a newly hired manager", "To promote a new kind of service the store is offering", "To explain how to reserve craft materials online"], "a": "C", "e": "Giới thiệu dịch vụ mới: các lớp workshop do cửa hàng tổ chức."}, {"n": "187", "q": "What does Ms. Pryce suggest in the registration form?", "o": ["She has taken a craft workshop before", "She is new to crafting", "She prefers a morning session", "She found out about the program from the store's Web page"], "a": "B", "e": "Tự chấm mức 1 và nói \"starting from the very beginning\" → mới bắt đầu."}, {"n": "188", "q": "What is most likely true about Ms. Pryce's aunt?", "o": ["She is also a beginner at crafts", "She works at a Foxglove store", "She lives outside Denbury", "She attended workshops run by other providers"], "a": "D", "e": "Dì học workshop nhiều năm, trong khi Foxglove trước giờ chưa từng mở lớp → học ở nơi khác."}, {"n": "189", "q": "Which session would be most suitable for Ms. Pryce?", "o": ["Introduction to Pottery", "Sculptural Candle Techniques", "Handmade Gift Cards", "Hand-Poured Candles"], "a": "D", "e": "Muốn làm nến thơm, trình độ mới bắt đầu → Hand-Poured Candles (Beginner)."}, {"n": "190", "q": "What is indicated about all of the sessions in the table?", "o": ["They are suitable for beginners", "They provide the materials that participants need", "They last ninety minutes", "They are intended for experienced crafters only"], "a": "B", "e": "\"Every session… includes all the materials you will need\"."}]}, {"kind": "P7", "text": "To: All Members\nFrom: Louise Trevino\nDate: 4 March\nSubject: March skills workshop\n\nDear Members,\n\nThe Cadwell Business Association is pleased to invite you to our next member skills workshop, to be held at 6:30 P.M. on Thursday, 20 March, in the Marrick Conference Room at our main office. The session is free for all members, and no prior preparation is required.\n\nWhat to expect:\n\nA ninety-minute session on planning and managing daily operations\nA guided exercise based on real workplace examples\nA question-and-answer period with the presenter\nA printed planning toolkit for every participant to take home\nThis month's session will be led by Desmond Attah, who served as operations director for eighteen years at Hartigan and Vale. Alongside that work, he co-runs a small print shop with his sister, and he gives three hours each week to the Bright Futures Coding Club.\n\nTo reserve a place, please reply to this message no later than Monday, 17 March, so that we can confirm seating.\n\nKind regards,\nLouise Trevino\n\n----------------------\n\nhttp://www.summitskills.co - Meet Our Presenters\n\nInterviewer: Welcome, Desmond. Could you tell our members a little about your professional background?\n\nDesmond Attah: Of course. I spent nearly two decades as an operations director at a commercial insurance provider, where I was responsible for coordinating the daily workflow across several busy departments.\n\nInterviewer: And where did your training begin?\n\nDesmond Attah: I completed a diploma in business administration at the Corley Institute, which gave me a solid foundation long before I ever managed a team.\n\nInterviewer: What will you focus on in your workshop for members?\n\nDesmond Attah: I will show participants simple, practical ways to plan their working day and keep projects on schedule, all without relying on extra software.\n\n----------------------\n\nBright Futures Coding Club\n\nDo you know a young person who is eager to learn how technology really works? Join a growing program that helps them build genuine skills, one session at a time. Sessions run every Saturday morning throughout the school term.\n\nHow it works:\n\nOpen to students between the ages of 11 and 16\nNo experience or equipment required\nEvery student is paired with a friendly mentor\nPlaces are offered on a first-come basis\nLast year we welcomed more than 300 young people to our sessions. The Bright Futures Coding Club is run entirely by volunteers, and our aim is simple: to help young people in our community gain practical coding skills that open doors to future study and work.\n\nTo take part, or to offer your time as a mentor, sign up at www.brightfuturesclub.org.", "qs": [{"n": "191", "q": "What does the email indicate about Mr. Attah?", "o": ["He runs a business with a family member.", "He is currently employed at an insurance company.", "He recently started his own print shop.", "He earned his diploma together with a relative."], "a": "A", "e": "Ông cùng em gái điều hành một tiệm in → kinh doanh với người nhà."}, {"n": "192", "q": "What will happen at the workshop?", "o": ["Attendees must prepare a task beforehand.", "Participants will receive printed materials to keep.", "Refreshments will be served to guests.", "Each attendee will give a short presentation."], "a": "B", "e": "\"A printed planning toolkit for every participant to take home\"."}, {"n": "193", "q": "What type of business is Hartigan and Vale?", "o": ["A professional training academy", "A business membership association", "A commercial insurance company", "A commercial printing company"], "a": "C", "e": "Email: giám đốc vận hành 18 năm ở Hartigan and Vale; phỏng vấn: làm ở \"a commercial insurance provider\" → công ty bảo hiểm."}, {"n": "194", "q": "According to the advertisement, what is a goal of the Bright Futures Coding Club?", "o": ["To donate equipment to local schools", "To provide career counseling to students", "To help young people build practical skills", "To raise money for community projects"], "a": "C", "e": "\"help young people… gain practical coding skills\"."}, {"n": "195", "q": "What most likely is Mr. Attah's connection to the Bright Futures Coding Club?", "o": ["He is a paid staff member.", "He is a financial donor.", "He founded the club.", "He is a volunteer."], "a": "D", "e": "Ông dành 3 giờ mỗi tuần cho câu lạc bộ, mà CLB \"run entirely by volunteers\" → tình nguyện viên."}]}, {"kind": "P7", "text": "From: Harriet Voss, Membership Coordinator\nTo: Trevor Aldington\nSubject: Welcome to the Fernbrook Tool Library\nDate: March 12\n\nDear Mr. Aldington,\n\nThank you for joining the Fernbrook Tool Library, a member-supported service that lends everyday equipment such as power drills, extension ladders, garden tools, and floor-cleaning machines. The library operates from a small workshop on Halbern Row in the Wexford district, and members may reserve items online at any time. The rules described below apply to every reservation, so please read them carefully before placing your first request.\n\nEach item may be borrowed for a maximum of fourteen days, after which it must be returned or renewed. For every loan, we hold a refundable deposit equal to twenty percent of the item's replacement value until the item comes back, and items returned after the due date are subject to an overdue charge of two dollars per item per day. Because short loans require additional handling, any reservation covering fewer than three days must be approved in advance by a staff coordinator.\n\nYour membership also carries several benefits. Members in good standing may borrow up to five items at one time at no additional charge, and every member receives one free equipment-safety workshop each year.\n\nIf you intend to collect your items outside our staffed opening hours, please make sure you have activated your locker access code before arriving, as our counter staff will not be present to assist you.\n\nKind regards,\nHarriet Voss\n\n----------------------\n\nCollection Point\tWeekday Hours\tWeekend Hours\tAfter-Hours Locker\tSame-Day Booking Cutoff\nHalbern Row Workshop\t9:00 A.M. - 5:00 P.M.\tClosed\tNo\t2:00 P.M.\nMaple Street Depot\t10:00 A.M. - 6:00 P.M.\t9:00 A.M. - 1:00 P.M.\tYes\t3:00 P.M.\nKingsley Park Shed\t8:00 A.M. - 4:00 P.M.\t8:00 A.M. - 12:00 P.M.\tYes\t1:00 P.M.\nDorwin Court Annex\t11:00 A.M. - 7:00 P.M.\tClosed\tNo\t4:00 P.M.\n----------------------\n\nFernbrook Tool Library - Reservation Summary\n\nMember: Trevor Aldington\nReservation Reference: TL-40518\nCollection Point: Maple Street Depot\nPickup Date and Time: Thursday, April 18 at 7:30 P.M.\nReturn Date: Saturday, April 20\nStatus: Confirmed online - short-loan request approved by coordinator\n\nReserved Items and Deposits\n- Cordless drill: $18.00\n- Extension ladder: $24.00\n- Pressure washer: $30.00\nTotal deposit held: $72.00\n\nPlease retain this summary. Questions may be sent to members@fernbrooktoollibrary.org.", "qs": [{"n": "196", "q": "According to the e-mail, how may members obtain the items they want?", "o": ["By booking them through the Web site whenever they wish", "By paying a regular membership fee", "By visiting a large central store to select them", "By reserving them at least three days ahead"], "a": "A", "e": "\"members may reserve items online at any time\"."}, {"n": "197", "q": "According to the e-mail, what is included with membership?", "o": ["A price reduction for returning items early", "Unlimited borrowing of any number of items", "One free safety training session each year", "A waived deposit for good-standing members"], "a": "C", "e": "\"every member receives one free equipment-safety workshop each year\"."}, {"n": "198", "q": "According to the table, which collection point opens earliest on weekdays?", "o": ["Kingsley Park Shed", "Halbern Row Workshop", "Maple Street Depot", "Dorwin Court Annex"], "a": "A", "e": "Kingsley Park Shed mở lúc 8:00 A.M. – sớm nhất."}, {"n": "199", "q": "How did the Fernbrook Tool Library accommodate Mr. Aldington's reservation?", "o": ["It reduced the deposit charged on his reserved items", "It gave special approval for a loan of fewer than three days", "It permitted a loan period longer than the usual maximum", "It provided a free safety workshop with his booking"], "a": "B", "e": "Mượn từ 18 đến 20/4 (dưới 3 ngày) → \"short-loan request
