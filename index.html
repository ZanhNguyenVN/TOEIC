<title>Sổ tay từ vựng TOEIC</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans:wght@400&display=swap" rel="stylesheet">
<style>
:root{--navy:#14284b;--ink:#1d2433;--mute:#667085;--line:#e6e8ee;--bg:#f6f7fa;--card:#fff;--acc:#e8590c;--acc2:#1c7ed6;--ok:#0b7a4b;--hl:#fff3bf}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
header{background:var(--navy);color:#fff;padding:20px 16px 16px}
header h1{margin:0;font-size:22px;font-weight:800}
header p{margin:4px 0 0;opacity:.75;font-size:13px}
.wrap{max-width:900px;margin:0 auto}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px}
#q{flex:1;min-width:0;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:#fff;outline:none}
#q:focus{border-color:var(--acc2)}
.tog{padding:0 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.tog.on{background:var(--acc);border-color:var(--acc);color:#fff}
#sel{display:block;width:100%;margin:8px 0 0;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 11px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}.chip[data-k="cz"]{border-color:#f1dcc3;color:#b35400}.chip[data-k="cz"].on{background:#b35400;border-color:#b35400;color:#fff}
main{padding:12px 12px 60px}
.grp{margin:22px 4px 8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:clip}
.sec>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .t{flex:1;font-weight:700;color:var(--navy);font-size:15px}
.badge{font-size:12px;font-weight:600;color:var(--mute);background:var(--bg);border-radius:20px;padding:3px 9px}
.chev{transition:transform .2s;color:var(--mute)}
.sec[open] .chev{transform:rotate(90deg)}
.sub{padding:8px 16px 6px;font-weight:700;font-size:13px;color:var(--acc2);border-top:1px solid var(--line);background:#fafbfd}
.it{display:grid;grid-template-columns:30px 1fr;gap:1px 8px;padding:9px 16px;border-top:1px solid var(--line)}
.n{grid-row:span 5;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums;padding-top:3px}
.hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.w{font-weight:700}
.p{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:#eef2ff;color:#3b4cca;white-space:nowrap}
.p.v{background:#e6fcf5;color:#087f5b}.p.adj{background:#fff4e6;color:#d9480f}.p.adv{background:#f8f0fc;color:#9c36b5}.p.ph{background:#f1f3f5;color:#495057}
.i{font-family:'Noto Sans',sans-serif;font-size:13px;color:var(--mute)}
.m{color:var(--ok);font-weight:500}
.syn{font-size:13px;color:#3b4a66}.syn b{color:var(--acc);font-weight:600}
.ex{font-size:13.5px;color:#344054;margin-top:3px;padding-left:9px;border-left:3px solid #d0d5dd}
.ex i{display:block;color:var(--mute);font-size:12.5px}
body.hide .m,body.hide .syn,body.hide .ex i{filter:blur(6px);user-select:none}
body.hide .it.rv .m,body.hide .it.rv .syn,body.hide .it.rv .ex i{filter:none}
mark{background:var(--hl);color:inherit;border-radius:3px}
#empty{display:none;text-align:center;color:var(--mute);padding:40px 0}
.hint{font-size:12px;color:var(--mute);text-align:center;margin:6px 0 0}
.sit{margin:0;border-top:1px solid var(--line);background:#fffaf3}
.sit>summary{list-style:none;cursor:pointer;padding:11px 16px;font-weight:700;font-size:13.5px;color:#b35400}
.sit>summary::-webkit-details-marker{display:none}
.sbody{padding:0 16px 14px}
.stype{font-size:12px;color:var(--mute);margin-bottom:6px}
.pass{white-space:pre-line;background:#fff;border:1px solid #f1dcc3;border-radius:10px;padding:12px;font-size:14px}
.pass b{color:var(--navy);background:#e7f1ff;padding:0 2px;border-radius:3px}
.btn{margin:8px 0 0;padding:7px 12px;border-radius:10px;border:1.5px solid #f1dcc3;background:#fff;font:inherit;font-size:13px;font-weight:600;color:#b35400}
.vi{display:none;margin-top:8px;font-size:13.5px;color:#475467;background:#fff;border-radius:10px;padding:10px 12px;border:1px dashed #e4c9a8}
.vi.on{display:block}
.qq{margin-top:12px}
.qt{font-weight:600;font-size:14px;margin-bottom:6px}
.op{display:block;width:100%;text-align:left;margin:5px 0;padding:8px 11px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:13.5px;color:var(--ink)}
.op.right{border-color:#2f9e44;background:#ebfbee}.op.wrong{border-color:#e03131;background:#fff5f5}
.exp{display:none;font-size:13px;color:#475467;margin-top:4px}.exp.on{display:block}
.md{padding:4px 16px 14px;font-size:14px}.md h4{margin:16px 0 6px;color:var(--navy)}.md p{margin:5px 0}.md ul{margin:4px 0;padding-left:20px}.md li{margin:3px 0}
.tw{overflow-x:auto;margin:6px 0}.tw table{border-collapse:collapse;font-size:13px;min-width:100%}.tw th{background:var(--navy);color:#fff;text-align:left;padding:6px 8px;font-weight:600}.tw td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}.tw tr:nth-child(even) td{background:#fafbfd}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:#fff3bf;color:#8a6d00}
.part{padding:10px 16px 4px;border-top:1px solid var(--line)}.part h5{margin:4px 0 8px;font-size:14px;color:#b35400}
.score{position:sticky;top:0;background:#14284b;color:#fff;padding:9px 16px;font-size:13.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center;z-index:2}
.score button{background:#fff;color:#14284b;border:0;border-radius:8px;padding:4px 10px;font:inherit;font-size:12px;font-weight:700}
.qn{font-weight:700;color:var(--acc2)}
.lctl{padding:10px 16px;font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line)}.lctl select{font:inherit;padding:4px 6px;border-radius:8px;border:1.5px solid var(--line)}.vnote{color:#b35400}
.play{display:inline-block;margin:6px 6px 4px 0;padding:8px 14px;border-radius:10px;border:0;background:var(--acc2);color:#fff;font:inherit;font-size:13.5px;font-weight:700}.play.on{background:#e03131}
.pic svg{width:100%;max-width:420px;display:block;margin:4px 0}
.oprow{display:flex;gap:8px}.oprow .op{text-align:center;flex:1}
@media(min-width:640px){.it{grid-template-columns:36px 1fr}}

.new{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:#ffe3e3;color:#c92a2a}
.ecard{padding:12px 16px 16px;border-top:1px solid var(--line)}
.ecard p{margin:4px 0;font-size:13.5px;color:#475467}
.go{margin-top:10px;padding:11px 18px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:700;font-size:15px}
.nv{margin-top:12px}.nv summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--acc2)}.nv li{font-size:13px;margin:3px 0}
.ex-ov{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.ex-ov[hidden]{display:none}
.ex-hd{background:var(--navy);color:#fff;display:flex;gap:8px;align-items:center;padding:8px 10px;flex-wrap:wrap}
.ex-hd{flex-wrap:nowrap!important}.ex-hd .tt{flex:1 1 0;min-width:0;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-hd .tm{font-variant-numeric:tabular-nums;font-weight:700;background:#ffffff1f;padding:4px 8px;border-radius:8px;font-size:13px}.tm.late{background:#e03131}
.ex-hd button{flex:none;border:0;border-radius:8px;padding:6px 9px;font:inherit;font-size:13px;font-weight:700;background:#fff;color:var(--navy)}
.ex-hd button.sub{background:var(--acc);color:#fff}.ex-hd button.sub.sure{background:#e03131}
.ex-res{background:#ebfbee;color:#1b5e20;font-size:13px;font-weight:600;padding:6px 12px;display:none}.ex-res.on{display:block}
.ex-body{flex:1;display:flex;min-height:0}
.ex-q{flex:1;overflow:auto;padding:10px 14px 40px;-webkit-overflow-scrolling:touch}
.ex-s{width:320px;overflow:auto;border-left:2px solid var(--navy);background:#fff;padding:8px 10px 30px}
.ex-s h6{margin:10px 0 4px;font-size:12px;color:var(--acc);letter-spacing:.06em;grid-column:1/-1}
.sh{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:3px 10px}
.sr{display:flex;align-items:center;gap:3px}
.sn{width:30px;font-size:12px;font-weight:700;color:var(--acc2);cursor:pointer;text-decoration:underline dotted}
.bb{width:25px;height:25px;border-radius:50%;border:1.5px solid #98a2b3;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#475467;cursor:pointer;user-select:none}
.bb.on{background:var(--navy);border-color:var(--navy);color:#fff}
.bb.ok{background:#2f9e44;border-color:#2f9e44;color:#fff}.bb.bad{background:#e03131;border-color:#e03131;color:#fff}.bb.key{border:2.5px solid #2f9e44;color:#2f9e44}
.ph{margin:18px 0 8px;font-weight:800;color:var(--acc);font-size:14px;letter-spacing:.04em}
.ps{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;line-height:1.55;margin:8px 0}
.ps table{border-collapse:collapse;font-size:12.5px;margin:6px 0;width:100%}.ps td{border:1px solid var(--line);padding:4px 6px;vertical-align:top}.ps tr:first-child td{font-weight:700;background:#f2f4f7}
.ps hr{border:0;border-top:2px dashed #d0d5dd;margin:12px 0}
.blank{background:#e7f1ff;color:var(--navy);padding:0 3px;border-radius:4px}.mk{color:var(--acc)}
.eq{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;scroll-margin-top:8px}
.eq .qt{font-size:14px;margin-bottom:4px}.eq .qt b{color:var(--acc2)}
.eo span{display:block;padding:5px 8px;margin:3px 0;border-radius:8px;font-size:13.5px;cursor:pointer}
.eo span.on{background:#e7f1ff;font-weight:600}.eo span.ok{background:#ebfbee;font-weight:600}.eo span.bad{background:#fff5f5;text-decoration:line-through}
.eq .exp{display:none;font-size:13px;color:#344054;margin-top:6px;background:#fffaf3;border-radius:8px;padding:7px 9px}.eq.done .exp{display:block}
@media(max-width:760px){.ex-body{flex-direction:column}.ex-s{width:auto;height:40%;border-left:0;border-top:3px solid var(--navy);flex:none}.ex-s.min{height:0;padding:0;border-top-width:3px;overflow:hidden}}

.xtabs{position:sticky;top:-10px;z-index:3;display:flex;gap:6px;background:var(--bg);padding:8px 0 8px;margin-top:-2px}
.xtabs button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 4px;font:inherit;font-weight:700;font-size:13.5px;color:var(--navy)}
.xtabs button small{display:block;font-weight:500;font-size:11px;color:var(--mute)}
.xtabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}.xtabs button.on small{color:#cfd8e6}
.xp{display:none}.xp.cur{display:block}
.set{display:none}.set.cur{display:block}
.setnav{display:flex;align-items:center;gap:8px;margin:8px 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px}
.setnav span{flex:1;text-align:center;font-weight:700;font-size:13.5px;color:var(--navy)}.setnav span small{display:block;font-weight:500;font-size:11.5px;color:var(--mute)}
.setnav button{border:0;background:var(--acc2);color:#fff;border-radius:9px;padding:8px 12px;font:inherit;font-weight:700;font-size:13px}.setnav button:disabled{background:#d0d5dd}
.doc{background:#fff;border:1px solid #dfe3ea;border-radius:12px;padding:14px 16px;margin:10px 0;box-shadow:0 1px 3px #1018280d;font-size:14.5px;line-height:1.6}
.doc .lbl{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
.doc .dt{margin:2px 0 8px;font-size:16px;color:var(--navy);line-height:1.35}
.doc p{margin:0 0 9px}.doc .li{margin:3px 0 3px 4px;padding-left:10px;border-left:3px solid #e7f1ff}
.doc .ins{font-size:12.5px;font-style:italic;color:var(--mute);margin-bottom:8px}
.mh{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;background:#f4f6fa;border-radius:8px;padding:9px 11px;margin-bottom:10px;font-size:13px}.mh span{color:var(--mute)}.mh b{font-weight:600}
.chat{display:flex;flex-direction:column;gap:8px;margin:4px 0 10px}.msg{background:#f1f5ff;border-radius:12px 12px 12px 4px;padding:7px 11px;max-width:92%}.msg:nth-child(even){align-self:flex-end;background:#ebfbee;border-radius:12px 12px 4px 12px}.msg .who{font-size:12px;font-weight:700;color:var(--navy)}.msg .who i{font-weight:500;color:var(--mute)}
.tw2{overflow-x:auto;margin:6px 0 10px}.tw2 table{border-collapse:collapse;font-size:13px;min-width:100%}.tw2 th{background:#14284b;color:#fff;text-align:left;padding:6px 8px}.tw2 td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
.sqh{font-weight:800;font-size:13px;color:var(--acc2);margin:12px 0 2px;letter-spacing:.03em}
@media(min-width:1100px){.setbody{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}.setbody .docs{position:sticky;top:44px;max-height:calc(100vh - 150px);overflow:auto}.sqh{margin-top:10px}}

.rset{display:none}.rset.cur{display:block}
.rsheet{display:none}.rsheet.open{display:block}
#exam[data-cur="P5"] .shtog{display:none}
.shtog{display:block;width:100%;margin:14px 0 6px;padding:9px;border:1.5px dashed #98a2b3;border-radius:10px;background:#f8f9fb;font:inherit;font-size:13px;font-weight:700;color:var(--navy)}
.rnav{display:flex;gap:8px;margin:10px 0}.rnav button{flex:1;border:0;background:var(--acc2);color:#fff;border-radius:9px;padding:9px;font:inherit;font-weight:700;font-size:13px}.rnav button:disabled{background:#d0d5dd}
.ex-s.wide{width:44%;background:#f8f9fb;padding:8px 12px 30px}
.ex-s.wide .eq{margin:8px 0}
.ex-s .eo span{border:1.5px solid var(--line);background:#fff;margin:5px 0;padding:7px 10px}
.ex-s .eo span.on{border-color:var(--navy);background:#e7f1ff}.ex-s .eo span.ok{border-color:#2f9e44}.ex-s .eo span.bad{border-color:#e03131}
@media(max-width:760px){.ex-s.wide{width:auto;height:46%}}
#exam[data-cur="P5"] .ex-s:not(.show){display:none}
#exam[data-cur="P5"] .ex-s.show{width:320px}
@media(max-width:760px){#exam[data-cur="P5"] .ex-s.show{width:auto;height:40%}}
.xp[data-p="P5"] .eo span{border:1.5px solid var(--line);background:#fff;margin:6px 0;padding:8px 11px}
.xp[data-p="P5"] .eo span.on{border-color:var(--navy);background:#e7f1ff}.xp[data-p="P5"] .eo span.ok{border-color:#2f9e44}.xp[data-p="P5"] .eo span.bad{border-color:#e03131}
.jmp{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-top:1px solid var(--line);background:#fafbfd}
.jmp button{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:5px 10px;font:inherit;font-size:12px;font-weight:600;color:var(--navy)}.jmp .jc{border-color:#f1dcc3;color:#b35400}
.sub{scroll-margin-top:150px}.cz{scroll-margin-top:150px;border-top:3px solid #f1dcc3;background:#fffaf3;padding:14px 16px 16px}
.czh{font-weight:800;color:#b35400;font-size:14px;margin-bottom:8px}
.czb{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.czb span{background:#fff;border:1.5px dashed #e4c9a8;border-radius:8px;padding:3px 9px;font-size:13px;font-weight:600}

.czp select.ok{border-color:#2f9e44;background:#ebfbee}.czp select.bad{border-color:#e03131;background:#fff5f5}
.czr{margin:10px 0 0;font-size:13.5px}.cza{margin-top:6px;color:#475467;font-size:13px;line-height:1.6}

.czt{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px}.czt button{flex:none;border:1.5px solid #f1dcc3;background:#fff;border-radius:10px;padding:5px 11px;font:inherit;font-size:13px;font-weight:700;color:#b35400}.czt button small{display:block;font-weight:500;font-size:10.5px;color:#98a2b3}.czt button.on{background:#b35400;color:#fff;border-color:#b35400}.czt button.on small{color:#ffe8cc}
.czx1{display:none}.czx1.on{display:block}

", "m": "báo cáo tài chính", "syn": "report = balance sheet = financial report = statement", "p": "cụm danh từ"}, {"w": "record", "m": "hồ sơ, sổ sách", "syn": "file = account = history = documentation = report", "p": "n, v", "i": "n. ˈrɛkərd · v. rɪˈkɔrd"}, {"w": "calculate", "m": "tính toán", "syn": "compute = determine = estimate = work out = figure out", "p": "v", "i": "ˈkælkjəˌleɪt"}, {"w": "budget deficit", "m": "thâm hụt ngân sách", "syn": "shortfall = financial deficit = loss = funding gap = deficit", "p": "cụm danh từ"}, {"w": "affordable", "m": "giá phải chăng", "syn": "reasonable = economical = inexpensive = cost-effective = budget-friendly", "p": "adj", "i": "əˈfɔrdəbəl"}, {"w": "expensive", "m": "đắt tiền", "syn": "costly = pricey = high-priced = overpriced = premium-priced", "p": "adj", "i": "ɪkˈspɛnsɪv"}]}], "note": "", "num": 29}]}, {"group": "Ngữ pháp tổng hợp", "sections": [{"id": "g-tense", "title": "1. 12 thì & tương lai (công thức – cách dùng – dấu hiệu)", "count": 0, "subs": [], "note": "", "md": "## Bảng tổng hợp 12 thì\n| Thì | Công thức (khẳng định) | Dùng khi | Dấu hiệu nhận biết |\n|---|---|---|---|\n| Hiện tại đơn | S + V(s/es) · be: am/is/are | Thói quen, sự thật, lịch trình cố định | always, usually, often, every day, each month |\n| Hiện tại tiếp diễn | S + am/is/are + V-ing | Đang xảy ra lúc nói; kế hoạch gần đã sắp xếp | now, at the moment, currently, this week |\n| Hiện tại hoàn thành | S + have/has + V3 | Đã xảy ra, kết quả còn ở hiện tại; kéo dài đến nay | since, for, already, yet, just, recently, so far |\n| HT hoàn thành tiếp diễn | S + have/has been + V-ing | Kéo dài liên tục đến nay, nhấn mạnh thời gian | for hours, since morning, all day |\n| Quá khứ đơn | S + V2/V-ed · be: was/were | Việc đã xong ở thời điểm xác định trong quá khứ | yesterday, last week, ago, in 2020 |\n| Quá khứ tiếp diễn | S + was/were + V-ing | Đang xảy ra tại một thời điểm QK; bị việc khác chen vào | at 8 p.m. yesterday, while, when |\n| Quá khứ hoàn thành | S + had + V3 | Xảy ra trước một việc khác trong quá khứ | before, after, by the time + QK đơn |\n| QK hoàn thành tiếp diễn | S + had been + V-ing | Kéo dài đến trước một mốc QK | for… before, until then |\n| Tương lai đơn | S + will + V | Quyết định tức thời, dự đoán, lời hứa | tomorrow, next week, soon, probably |\n| Tương lai gần | S + am/is/are going to + V | Dự định có từ trước; dự đoán có căn cứ | đã có kế hoạch, có dấu hiệu |\n| Tương lai tiếp diễn | S + will be + V-ing | Đang diễn ra tại một thời điểm tương lai | at this time tomorrow |\n| Tương lai hoàn thành | S + will have + V3 | Hoàn thành trước một mốc tương lai | by the end of, by next month, by the time + HT đơn |\n## Phủ định & nghi vấn nhanh\n- **Động từ thường:** do/does/did + not + V nguyên mẫu → *She does not (doesn't) work on Sundays.* · *Did you send the invoice?*\n- **Động từ be / trợ động từ:** thêm not sau trợ động từ → *is not, have not, will not (won't), had not*; đảo trợ động từ lên đầu để hỏi → *Has the shipment arrived?*\n## Mẹo TOEIC hay ra\n- **Mệnh đề thời gian (when, before, after, as soon as, by the time, until, once) KHÔNG dùng will** → dùng hiện tại đơn/HTHT: *We will call you as soon as the order **arrives**.* (không dùng *will arrive*)\n- **since + mốc / for + khoảng** → hiện tại hoàn thành: *She **has worked** here since 2019 / for five years.*\n- **by + mốc tương lai** → tương lai hoàn thành: *By next Friday, we **will have completed** the project.*\n- **last + thời gian / ago** → quá khứ đơn: *The meeting **was held** last Monday.*\n- **Lịch trình, thời gian biểu** (tàu, xe, sự kiện) dùng hiện tại đơn dù nói về tương lai: *The train **leaves** at 9 tomorrow.*\n- **will vs be going to:** *I'll answer the phone* (quyết định ngay) · *We're going to open a new branch* (đã lên kế hoạch)."}, {"id": "g-ending", "title": "2. Thêm s/es · -ed · -ing (viết & phát âm)", "count": 0, "subs": [], "note": "", "md": "## Thêm s/es (động từ ngôi 3 số ít & danh từ số nhiều)\n| Quy tắc | Ví dụ |\n|---|---|\n| Thông thường: + s | work → works, report → reports |\n| Tận cùng -s, -ss, -sh, -ch, -x, -z, -o: + es | pass → passes, finish → finishes, fax → faxes, go → goes |\n| Phụ âm + y → bỏ y, + ies | apply → applies, company → companies |\n| Nguyên âm + y: + s | pay → pays, delay → delays |\n| Danh từ -f/-fe → -ves | shelf → shelves, knife → knives |\n| Bất quy tắc | person → people, child → children, man → men, analysis → analyses, criterion → criteria |\n## Phát âm s/es\n| Âm cuối của từ | Đọc | Ví dụ |\n|---|---|---|\n| /s/, /z/, /ʃ/, /ʒ/, /tʃ/, /dʒ/ (chữ s, x, z, sh, ch, ge, ce) | **/ɪz/** | buses, boxes, watches, changes, offices |\n| /p/, /t/, /k/, /f/, /θ/ (âm vô thanh) | **/s/** | stops, reports, works, laughs, months |\n| Các âm còn lại (nguyên âm, âm hữu thanh) | **/z/** | plays, calls, plans, jobs, orders |\n## Thêm -ed (quá khứ/phân từ động từ có quy tắc)\n| Quy tắc | Ví dụ |\n|---|---|\n| Thông thường: + ed | work → worked, ask → asked |\n| Tận cùng -e: + d | hire → hired, arrange → arranged |\n| Phụ âm + y → ied | apply → applied, carry → carried |\n| Nguyên âm + y: + ed | delay → delayed, stay → stayed |\n| 1 âm tiết (hoặc trọng âm cuối) dạng phụ âm–nguyên âm–phụ âm → gấp đôi phụ âm cuối | stop → stopped, plan → planned, submit → submitted, prefer → preferred |\n| Không gấp đôi khi trọng âm không rơi vào âm cuối | visit → visited, open → opened, offer → offered |\n## Phát âm -ed\n| Âm cuối | Đọc | Ví dụ |\n|---|---|---|\n| /t/, /d/ | **/ɪd/** | wanted, needed, started, decided |\n| Âm vô thanh /p/, /k/, /f/, /s/, /ʃ/, /tʃ/ | **/t/** | stopped, worked, laughed, finished, watched |\n| Còn lại | **/d/** | played, called, delivered, ordered |\n## Thêm -ing\n| Quy tắc | Ví dụ |\n|---|---|\n| Thông thường: + ing | work → working |\n| Tận cùng -e câm: bỏ e + ing | make → making, arrange → arranging (nhưng see → seeing) |\n| -ie → y + ing | lie → lying, die → dying |\n| Phụ âm–nguyên âm–phụ âm (trọng âm cuối) → gấp đôi | run → running, plan → planning, begin → beginning |"}, {"id": "g-pos", "title": "3. Danh – động – tính – trạng từ: vị trí & đuôi nhận biết", "count": 0, "subs": [], "note": "", "md": "## Vị trí trong câu (Part 5 hỏi nhiều nhất)\n| Từ loại | Đứng ở đâu | Ví dụ |\n|---|---|---|\n| **Danh từ (N)** | Sau a/an/the, sau tính từ, sau sở hữu (my, the company's), sau giới từ, làm chủ ngữ/tân ngữ | the **approval** of the board · a detailed **analysis** |\n| **Động từ (V)** | Sau chủ ngữ; sau trợ động từ/khuyết thiếu (will, can, should + V nguyên mẫu) | The manager will **approve** the budget. |\n| **Tính từ (Adj)** | Trước danh từ; sau be, become, seem, remain, look, stay, find + O + adj | an **effective** plan · The plan is **effective**. |\n| **Trạng từ (Adv)** | Bổ nghĩa động từ, tính từ, trạng từ khác, cả câu; giữa trợ động từ và V; đầu câu | The plan was **carefully** prepared. · It is **extremely** important. |\n## Đuôi nhận biết\n| Từ loại | Đuôi thường gặp | Ví dụ |\n|---|---|---|\n| Danh từ | -tion, -sion, -ment, -ness, -ity, -ance, -ence, -ship, -ure, -age, -ism | decision, payment, efficiency, leadership, failure, shortage |\n| Danh từ chỉ người | -er, -or, -ee, -ist, -ant, -ent, -ian | employer, supervisor, employee, specialist, applicant, technician |\n| Động từ | -ize/-ise, -ify, -ate, -en | organize, notify, evaluate, strengthen |\n| Tính từ | -ive, -ous, -ful, -less, -able/-ible, -al, -ic, -ant/-ent, -ary, -y | effective, various, helpful, reliable, financial, economic, significant, temporary |\n| Trạng từ | phần lớn = tính từ + -ly | effectively, carefully, recently, significantly |\n## Word family hay ra\n| Danh từ | Động từ | Tính từ | Trạng từ |\n|---|---|---|---|\n| success | succeed | successful | successfully |\n| decision | decide | decisive | decisively |\n| efficiency | — | efficient | efficiently |\n| expansion | expand | expansive | — |\n| approval | approve | approved | — |\n| competition / competitor | compete | competitive | competitively |\n| production / product | produce | productive | productively |\n| reliability | rely | reliable | reliably |\n| completion | complete | complete | completely |\n| responsibility | — | responsible | responsibly |\n## Bẫy cần nhớ\n- Tính từ **-ing** mô tả *bản chất gây ra cảm xúc*, **-ed** mô tả *cảm xúc của người*: *The report is **interesting**.* / *I am **interested** in the report.*\n- **Trạng từ không đuôi -ly:** hard, fast, late, early, well (good → well). *hardly* = hầu như không, *lately* = gần đây (khác nghĩa!).\n- **friendly, lovely, costly, timely, likely** là TÍNH TỪ dù có đuôi -ly.\n- Danh từ ghép: N + N → *safety regulations, customer satisfaction* (danh từ đầu đóng vai trò như tính từ, không thêm s)."}, {"id": "g-passive", "title": "4. Câu bị động", "count": 0, "subs": [], "note": "", "md": "## Công thức: be (chia theo thì) + V3/V-ed (+ by O)\n| Thì | Chủ động | Bị động |\n|---|---|---|\n| Hiện tại đơn | They clean the office. | The office **is cleaned**. |\n| Hiện tại tiếp diễn | They are cleaning the office. | The office **is being cleaned**. |\n| Hiện tại hoàn thành | They have cleaned the office. | The office **has been cleaned**. |\n| Quá khứ đơn | They cleaned the office. | The office **was cleaned**. |\n| Tương lai đơn | They will clean the office. | The office **will be cleaned**. |\n| Động từ khuyết thiếu | They must clean the office. | The office **must be cleaned**. |\n## Mẹo nhận biết trong Part 5\n- Chỗ trống sau **be** mà phía sau **không có tân ngữ** (hoặc có **by**) → chọn **V3**: *All applications must be ------- by Friday.* → **submitted**.\n- Phía sau có tân ngữ (danh từ) → thường là chủ động: *The manager has ------- the proposal.* → **approved**.\n- Bị động hay đi với: *be required to, be expected to, be scheduled to, be located in, be designed to, be based on*."}, {"id": "g-cond", "title": "5. Câu điều kiện", "count": 0, "subs": [], "note": "", "md": "| Loại | Mệnh đề If | Mệnh đề chính | Dùng khi |\n|---|---|---|---|\n| Loại 0 | If + HT đơn | HT đơn | Sự thật luôn đúng: *If you heat ice, it melts.* |\n| Loại 1 | If + HT đơn | will/can/may + V | Có thể xảy ra ở hiện tại/tương lai: *If the order arrives today, we **will** ship it.* |\n| Loại 2 | If + QK đơn (were) | would/could + V | Không có thật ở hiện tại: *If I **were** the manager, I would hire more staff.* |\n| Loại 3 | If + QK hoàn thành | would have + V3 | Không có thật trong quá khứ: *If we **had left** earlier, we would have caught the train.* |\n## Biến thể TOEIC\n- **Unless = If… not:** *Unless you register by Friday, you cannot attend.*\n- **Đảo ngữ:** *Should you have any questions, please contact us.* (= If you should have…) · *Had we known, we would have helped.*\n- **Provided (that) / As long as / In case** = miễn là / phòng khi."}, {"id": "g-rel", "title": "6. Mệnh đề quan hệ", "count": 0, "subs": [], "note": "", "md": "| Đại từ | Thay cho | Ví dụ |\n|---|---|---|\n| who | người (chủ ngữ) | The woman **who** called is our client. |\n| whom | người (tân ngữ) | The candidate **whom** we interviewed was excellent. |\n| which | vật | The report **which** you sent is incomplete. |\n| that | người/vật (không dùng sau dấu phẩy, sau giới từ) | The products **that** we ordered arrived. |\n| whose | sở hữu (của người/vật) | The employee **whose** car was damaged filed a claim. |\n| where | nơi chốn | This is the office **where** I work. |\n| when | thời gian | Friday is the day **when** the shop closes early. |\n## Rút gọn mệnh đề quan hệ\n- Chủ động → **V-ing**: *Employees **wishing** to attend should register.* (= who wish)\n- Bị động → **V3**: *The documents **attached** to this e-mail are confidential.* (= which are attached)"}, {"id": "g-comp", "title": "7. So sánh", "count": 0, "subs": [], "note": "", "md": "| Loại | Tính từ ngắn | Tính từ dài |\n|---|---|---|\n| Bằng | as + adj + as | as + adj + as |\n| Hơn | adj-er + than (cheaper than) | more + adj + than (more expensive than) |\n| Nhất | the + adj-est (the cheapest) | the most + adj (the most efficient) |\n- Bất quy tắc: good/well → better → best · bad → worse → worst · far → farther/further · many/much → more → most · little → less → least.\n- Nhấn mạnh so sánh hơn: **much, far, significantly, considerably** + so sánh hơn (*much cheaper*). Không dùng *very* + so sánh hơn.\n- **The + so sánh hơn…, the + so sánh hơn:** *The sooner you apply, the better your chances.*"}, {"id": "g-ving", "title": "8. V-ing hay to V", "count": 0, "subs": [], "note": "", "md": "| Theo sau là **to V** | Theo sau là **V-ing** |\n|---|---|\n| want, plan, decide, agree, hope, expect, offer, promise, refuse, fail, manage, afford, intend, need, wish, ask, arrange | avoid, consider, finish, suggest, recommend, enjoy, mind, postpone, delay, keep, practice, deny, include, involve, risk, discuss |\n| be able to, be likely to, be eager to, be pleased to | look forward to, be used to, be committed to, be dedicated to, object to, contribute to (**to là giới từ → V-ing**) |\n- **Sau giới từ** (in, on, of, for, by, without, before, after…) luôn dùng **V-ing**: *before **leaving**, by **using**, without **asking***.\n- **Đổi nghĩa:** *stop to do* (dừng lại để làm) ≠ *stop doing* (ngừng làm) · *remember/forget to do* (nhớ/quên sẽ làm) ≠ *remember doing* (nhớ đã làm) · *try to do* (cố gắng) ≠ *try doing* (thử).\n- **in order to / so as to + V** = để mà."}, {"id": "g-conj", "title": "9. Liên từ & giới từ dễ nhầm", "count": 0, "subs": [], "note": "", "md": "| Theo sau là **mệnh đề (S + V)** | Theo sau là **danh từ / V-ing** | Nghĩa |\n|---|---|---|\n| although, even though, though | despite, in spite of | mặc dù |\n| because, since, as | because of, due to, owing to | bởi vì |\n| while, when | during | trong khi / trong suốt |\n| before, after, until, since | before, after, until, since (cũng là giới từ) | trước/sau/cho đến/kể từ |\n| unless, if | without | nếu không |\n| so that | in order to + V | để |\n## Cặp liên từ\n- **both A and B** · **either A or B** · **neither A nor B** · **not only A but (also) B** · **whether A or B**\n- Động từ sau *either…or / neither…nor / not only…but also* chia theo **B** (danh từ gần nhất).\n## Giới từ thời gian & nơi chốn\n- **at** + giờ (at 9 a.m.), **on** + ngày/thứ (on Monday, on May 5), **in** + tháng/năm/buổi (in May, in 2026, in the morning).\n- **by** (trước/không muộn hơn) ≠ **until** (kéo dài đến): *Submit it **by** Friday.* / *The office is closed **until** Friday.*\n- **within** + khoảng thời gian (trong vòng): *within 30 days*."}, {"id": "g-agree", "title": "10. Hòa hợp chủ ngữ – động từ & đại từ", "count": 0, "subs": [], "note": "", "md": "- Chủ ngữ số ít → động từ số ít: *Each employee **has**…* · *Every room **is**…* · *The number of orders **has** increased.*\n- *A number of + N số nhiều* → động từ số nhiều: *A number of customers **have** complained.*\n- Danh từ không đếm được → động từ số ít: *information, equipment, furniture, advice, luggage, research, feedback* (không thêm s).\n- Chủ ngữ dài có cụm giới từ → tìm danh từ chính: *The list **of new products** **is** attached.*\n## Đại từ\n| Chủ ngữ | Tân ngữ | Tính từ sở hữu | Đại từ sở hữu | Phản thân |\n|---|---|---|---|---|\n| I | me | my | mine | myself |\n| you | you | your | yours | yourself |\n| he | him | his | his | himself |\n| she | her | her | hers | herself |\n| it | it | its | — | itself |\n| we | us | our | ours | ourselves |\n| they | them | their | theirs | themselves |\n- **by + đại từ phản thân** = tự mình: *She finished the report **by herself**.*\n- Trước danh từ → tính từ sở hữu (*their office*); đứng một mình → đại từ sở hữu (*the office is theirs*)."}, {"id": "g-link", "title": "11. Từ nối Part 6 (chọn câu & chọn từ)", "count": 0, "subs": [], "note": "", "md": "| Chức năng | Từ nối |\n|---|---|\n| Bổ sung | in addition, additionally, moreover, furthermore, also, besides |\n| Đối lập | however, nevertheless, on the other hand, in contrast, by comparison, even so |\n| Kết quả | therefore, as a result, consequently, thus, accordingly |\n| Nhấn mạnh, xác nhận | indeed, in fact, actually, of course |\n| Ví dụ | for example, for instance, in particular, specifically |\n| Điều kiện | otherwise (nếu không thì), if so, if not, in that case |\n| Thời gian, thứ tự | first, then, afterward, meanwhile, in the meantime, finally, previously |\n| Tóm lại | in short, in summary, overall |\n## Cách làm câu chèn câu (sentence insertion) Part 6\n- Đọc câu **trước và sau** chỗ trống; câu đúng phải nối mạch về **đại từ** (it, they, this), **từ nối** và **chủ đề**.\n- Loại câu đưa thông tin mới không liên quan, hoặc mâu thuẫn với thì của đoạn.\n- Câu đầu thư thường là **giới thiệu / mục đích**; câu cuối thường là **lời mời liên hệ / cảm ơn**."}, {"id": "g-modal", "title": "12. Động từ khuyết thiếu (modal verbs)", "count": 0, "subs": [], "note": "", "md": "## Công thức: Modal + V nguyên mẫu (không chia, không to)\n| Modal | Nghĩa / cách dùng | Ví dụ |\n|---|---|---|\n| can / could | có thể (khả năng, xin phép, nhờ lịch sự) | **Could** you send me the file? |\n| may / might | có lẽ, có thể (khả năng thấp hơn); xin phép trang trọng | The flight **may** be delayed. |\n| must | phải (bắt buộc từ người nói, quy định); chắc hẳn (suy luận) | Visitors **must** sign in. · He **must** be busy. |\n| have to | phải (do hoàn cảnh); quá khứ: had to | We **had to** cancel the event. |\n| should / ought to | nên | You **should** back up your data. |\n| will / would | sẽ; would = lời mời, đề nghị lịch sự | **Would** you like some coffee? |\n| need not (needn't) / don't have to | không cần phải | You **don't have to** bring a laptop. |\n| must not | cấm | You **must not** smoke here. |\n## Modal + have + V3 (nói về quá khứ)\n- **should have + V3**: lẽ ra nên (nhưng đã không) → *You should have called earlier.*\n- **must have + V3**: chắc hẳn đã → *The package must have been lost.*\n- **could / might have + V3**: có thể đã → *She might have missed the train.*\n## Bị động với modal: modal + be + V3 → *The form **must be submitted** by Friday.*"}, {"id": "g-article", "title": "13. Mạo từ & từ chỉ số lượng", "count": 0, "subs": [], "note": "", "md": "## a / an / the / không mạo từ\n| Dùng | Khi nào | Ví dụ |\n|---|---|---|\n| **a** | trước danh từ đếm được số ít, âm đầu là phụ âm | a manager, **a** university (/ju/), a one-day course |\n| **an** | trước âm đầu là nguyên âm | an employee, **an** hour (h câm), an MBA |\n| **the** | đã xác định / nhắc lại / duy nhất / so sánh nhất / số thứ tự | **the** report I sent you, **the** best offer, **the** first floor |\n| không mạo từ | danh từ số nhiều hoặc không đếm được nói chung; bữa ăn; môn học | Employees need **training**. · have **lunch** |\n## Từ chỉ số lượng\n| + danh từ đếm được số nhiều | + danh từ không đếm được | Cả hai |\n|---|---|---|\n| many, a few (một vài), few (rất ít), several, a number of, each/every (+ số ít) | much, a little (một chút), little (rất ít), an amount of, a great deal of | some, any, a lot of, lots of, plenty of, most, all, no |\n- **each / every + N số ít + V số ít**: *Every employee **has** an ID card.*\n- **one of + N số nhiều + V số ít**: *One of the printers **is** broken.*\n- **most + N** (nói chung) vs **most of the + N** (xác định): *Most customers… / Most of the customers in this survey…*\n- **another + N số ít** · **other + N số nhiều** · **the other** (cái còn lại) · **others** (những cái khác, đứng một mình)."}, {"id": "g-special", "title": "14. Cấu trúc đặc biệt hay ra Part 5", "count": 0, "subs": [], "note": "", "md": "## Giả định (subjunctive) – rất hay ra\n- **recommend / suggest / request / require / insist / ask + that + S + V nguyên mẫu** (không chia, không s): *The manager requested that every employee **attend** the meeting.* · *It is essential/important/necessary that the report **be** finished today.*\n## Thể truyền khiến (causative)\n- **have + người + V** / **get + người + to V**: *I had the assistant **book** the room.* · *I got him **to check** the data.*\n- **have / get + vật + V3** (nhờ ai làm gì cho mình): *We had the printer **repaired**.*\n- **make + người + V** (bắt), **let + người + V** (cho phép), **help + người + (to) V**.\n## Đảo ngữ\n- **Only after / Only when / Not until … + trợ động từ + S**: *Only after the contract was signed **did we start** the project.*\n- **Never / Rarely / Seldom / Hardly + trợ động từ + S**: *Rarely **has** the company seen such growth.*\n- **No sooner had S + V3 than…** · **Hardly had S + V3 when…** (vừa mới… thì…).\n## used to / be used to / get used to\n- **used to + V**: đã từng (nay không còn) → *He used to work in sales.*\n- **be / get used to + V-ing**: quen / dần quen với → *She is used to working late.*\n## It / There làm chủ ngữ giả\n- **It is + adj + to V / that…**: *It is important to arrive on time.*\n- **There is / are + N** (động từ chia theo danh từ sau): *There **are** several options.*\n## Danh từ + giới từ hay ra\n- increase **in** sales · demand **for** · access **to** · interest **in** · solution **to** · reason **for** · effect **on** · advantage **of** · responsibility **for** · experience **in/with**.\n- Tính từ + giới từ: responsible **for**, eligible **for**, familiar **with**, interested **in**, aware **of**, capable **of**, similar **to**, satisfied **with**, subject **to**, compatible **with**."}, {"id": "g-listen", "title": "15. Mẹo Listening theo từng Part", "count": 0, "subs": [], "note": "", "md": "## Part 1 – Mô tả tranh\n- **Đang làm gì:** *is/are + V-ing* (người đang hành động). **Trạng thái của vật:** *has/have been + V3* hoặc *is/are + V3* (*Chairs have been arranged*).\n- **Bẫy:** *is being + V3* = đang có người làm việc đó. Nếu ảnh không có người thì gần như luôn sai (*A table is being cleaned* sai khi không ai đang lau).\n- Loại ngay câu nhắc tới người/vật không có trong ảnh.\n## Part 2 – Hỏi đáp (dễ mất điểm nhất)\n- Nghe chắc **từ để hỏi đầu tiên** (Who / What / When / Where / Why / How) là đã loại được một nửa đáp án.\n- **Bẫy lặp từ / đồng âm:** đáp án lặp lại từ trong câu hỏi thường SAI (*file – filed, ship – shipment, book – book*).\n- Câu hỏi Wh- **không** trả lời bằng Yes/No.\n- **Câu hỏi lựa chọn (A or B):** chọn một trong hai, hoặc \"Either is fine\", \"Neither\".\n- **Lời đề nghị / nhờ vả** (Would you like…?, Could you…?, Why don't we…?): trả lời \"Sure\", \"That would be great\", \"Sorry, I'm busy\".\n- **Câu trần thuật / câu hỏi đuôi:** đáp án đúng hay là câu gián tiếp như \"Let me check\", \"I'll ask the manager\", \"Didn't you get the e-mail?\".\n## Part 3 & 4 – Hội thoại, bài nói\n- **Đọc trước 3 câu hỏi** trong lúc máy đọc hướng dẫn; gạch chân từ khóa (who, why, what will…next).\n- Thứ tự câu hỏi thường **trùng với thứ tự thông tin** trong bài nghe.\n- Đáp án đúng thường **paraphrase** chứ không lặp nguyên văn (*updated → revised, no extra charge → free*).\n- Câu hỏi **\"What will the man do next?\"** thường nằm ở câu cuối bài; câu hỏi chủ đề / mục đích nằm ở 1–2 câu đầu.\n- Part 4 có 4 dạng chính: **thông báo** (announcement), **tin nhắn thoại** (voicemail), **quảng cáo**, **giới thiệu diễn giả / tour**."}, {"id": "g-tips", "title": "16. Nhận diện danh từ & câu mẫu hợp đồng", "count": 0, "subs": [], "note": "", "md": "## Nhìn 1 từ, biết ngay đó là danh từ hay không\n1. **Sau mạo từ (a/an/the)** → a/an/the + (Adj) + N. Ví dụ: a manager, an employee, the report. *The company announced a new policy.* → Công ty đã công bố một chính sách mới.\n2. **Sau tính từ** → Adj + N. Ví dụ: financial report, annual meeting, new product.\n3. **Sau sở hữu cách ('s)** → N's + N. Ví dụ: company's policy, employee's schedule, customer's complaint. *The customer's request was approved.* → Yêu cầu của khách hàng đã được chấp thuận.\n4. **Sau tính từ sở hữu** → my/your/his/her/our/their + N. Ví dụ: my office, your application, their proposal.\n5. **Sau lượng từ** → many/several/few + N số nhiều (many employees, several applicants, few customers); much/little + N không đếm được (much information, little equipment).\n6. **Đuôi danh từ hay gặp nhất:** -tion/-sion (information, application, decision, promotion) · -ment (agreement, development, management, improvement) · -ance/-ence (attendance, performance, importance, existence) · -ity (activity, opportunity, responsibility, ability) · -ness (business, awareness, effectiveness, friendliness) · -er/-or (manager, employer, supervisor, director).\n7. **Trong cụm danh từ, từ cuối cùng là danh từ chính.** Ví dụ: Customer Service Department, Annual Sales Report, Marketing Research Project.\n\n## 10 câu mẫu hợp đồng hay gặp\n1. The contract will take effect on Monday. → Hợp đồng sẽ có hiệu lực vào thứ Hai.\n2. Both parties must sign the agreement. → Cả hai bên phải ký thỏa thuận.\n3. The company is required to comply with the regulations. → Công ty được yêu cầu tuân thủ các quy định.\n4. The agreement is subject to final approval. → Thỏa thuận phụ thuộc vào sự phê duyệt cuối cùng.\n5. Please review the terms and conditions carefully. → Vui lòng xem xét kỹ các điều khoản và điều kiện.\n6. The contract is due to expire next month. → Hợp đồng dự kiến hết hạn vào tháng tới.\n7. The parties reached a mutual agreement. → Các bên đã đạt được thỏa thuận chung.\n8. The company may terminate the contract without notice. → Công ty có thể chấm dứt hợp đồng mà không cần thông báo trước.\n9. All employees must sign a confidentiality agreement. → Tất cả nhân viên phải ký thỏa thuận bảo mật.\n10. Please submit the required legal documents by Friday. → Vui lòng nộp các tài liệu pháp lý cần thiết trước thứ Sáu."}]}, {"group": "Động từ bất quy tắc", "sections": [{"id": "irr", "title": "Bảng động từ bất quy tắc (V1 – V2 – V3)", "count": 178, "subs": [{"title": "Nhóm AAA – 3 dạng giống nhau (cut – cut – cut) (24)", "items": [{"w": "bet – bet – bet", "m": "cá cược", "p": "v", "tag": "AAA", "i": "bɛt"}, {"w": "bid – bid – bid", "m": "đặt giá, trả giá (đấu thầu)", "p": "v", "tag": "AAA", "i": "bɪd"}, {"w": "broadcast – broadcast – broadcast", "m": "phát sóng", "p": "v", "tag": "AAA", "i": "ˈbrɔdˌk
